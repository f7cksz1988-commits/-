<!doctype html><!--R-->
<html lang="zh-CN"><!--R-->
<head><!--R-->
<meta charset="utf-8"><!--R-->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><!--R-->
<title>衣橱手账</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="manifest.webmanifest"><!--R-->
<link rel="apple-touch-icon" href="icon-192.png"><!--R-->
<link rel="icon" href="icon.svg" type="image/svg+xml"><!--R-->
<meta name="apple-mobile-web-app-capable" content="yes"><!--R-->
<meta name="mobile-web-app-capable" content="yes"><!--R-->
<meta name="apple-mobile-web-app-title" content="衣橱手账"><!--R-->
<meta name="theme-color" content="#F3F2F6"><!--R-->
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><!--R-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-column phone app — sticky header, scrolling content, fixed bottom tab bar; widens to a centred 980px column on desktop. */
:root{
  --bg:#F3F2F6; --surface:#FFFFFF; --tile:#EBE8F0; --ink:#25212C; --muted:#6F6979; --line:#DDD8E4;
  --accent:#B23A6B; --accent-ink:#FFFFFF; --accent-soft:#F5E0E9;
  --teal:#2C6B70; --teal-soft:#DDEEEE; --warn:#A9501C; --warn-soft:#FBE6D8; --ok:#2E7550; --ok-soft:#DDF0E4;
  --stage:#E7E3EE; --shadow:0 1px 2px rgba(37,33,44,.05),0 6px 20px rgba(37,33,44,.07);
  --f-display:"Noto Serif SC","Songti SC","STSong",serif;
  --f-body:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17151B; --surface:#221F28; --tile:#2B2732; --ink:#EEEAF3; --muted:#A39CAD; --line:#38323F;
  --accent:#E8779F; --accent-ink:#1C1218; --accent-soft:#3D2331;
  --teal:#83C6C8; --teal-soft:#1F3436; --warn:#F2A473; --warn-soft:#3B2619; --ok:#86CFA2; --ok-soft:#1D3326;
  --stage:#252129; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17151B; --surface:#221F28; --tile:#2B2732; --ink:#EEEAF3; --muted:#A39CAD; --line:#38323F;
  --accent:#E8779F; --accent-ink:#1C1218; --accent-soft:#3D2331;
  --teal:#83C6C8; --teal-soft:#1F3436; --warn:#F2A473; --warn-soft:#3B2619; --ok:#86CFA2; --ok-soft:#1D3326;
  --stage:#252129; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}

html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid transparent}
.top.scrolled{border-bottom-color:var(--line)}
.top-row{display:flex;align-items:center;gap:12px;padding-block:12px 8px}
.brand{flex:1;min-width:0}
.brand h1{font:700 22px/1.2 var(--f-display);margin:0;letter-spacing:.02em}
.brand p{margin:2px 0 0;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);flex:none}
.icon-btn svg{width:20px;height:20px}
.search-row{display:flex;gap:8px;padding-block:0 10px}
.search{flex:1;min-width:0;position:relative}
.search svg{position:absolute;left:12px;top:50%;width:17px;height:17px;transform:translateY(-50%);color:var(--muted)}
.search input{width:100%;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 12px 0 36px;outline:none}
.search input:focus{border-color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:42px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.soft{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.btn.ghost{background:transparent}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn.danger.armed{background:var(--warn);color:var(--surface)}
.btn.sm{height:34px;padding:0 11px;font-size:13.5px;border-radius:10px}
.btn svg{width:17px;height:17px}
.link{background:none;border:0;color:var(--accent);padding:0;font-size:13.5px;text-decoration:underline;text-underline-offset:3px}

main{padding-block:4px 120px}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);color:var(--ink);border-radius:var(--r);padding:12px 14px;margin-block:4px 12px;font-size:13.5px}
.banner p{margin:0;flex:1 1 220px}
.banner .acts{display:flex;gap:8px}

/* chips */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;padding-block:2px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;white-space:nowrap}
.chip .n{font:500 11.5px var(--f-mono);color:var(--muted)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.on .n{color:inherit;opacity:.7}
.chip.sub{height:28px;font-size:12.5px;padding:0 10px;background:transparent}
.chip.sub.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.filters{display:grid;gap:8px;margin-block:4px 14px}

/* summary strip */
.summary{display:flex;gap:18px;flex-wrap:wrap;padding:12px 2px 14px;border-bottom:1px dashed var(--line);margin-bottom:12px}
.summary div{display:flex;flex-direction:column}
.summary b{font:500 22px/1.1 var(--f-mono);font-variant-numeric:tabular-nums}
.summary span{font-size:12px;color:var(--muted)}
.section-title{font:700 16px/1.3 var(--f-display);margin:18px 0 10px;display:flex;align-items:baseline;gap:8px}
.section-title small{font:400 12px var(--f-body);color:var(--muted)}

/* item grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
@media (min-width:640px){.grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}}
.card{display:flex;flex-direction:column;gap:6px;text-align:left;background:none;border:0;padding:0;min-width:0}
.thumb{position:relative;aspect-ratio:1;max-width:100%;width:100%;border-radius:12px;background:var(--tile);overflow:hidden;display:grid;place-items:center}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb svg{width:78%;height:78%}
.thumb .badge{position:absolute;left:6px;top:6px}
.card .nm{font-size:13px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
.seasons{display:flex;gap:3px}
.seasons i{font-style:normal;font-size:10.5px;width:17px;height:17px;display:grid;place-items:center;border-radius:5px;color:var(--muted);background:var(--tile)}
.seasons i.on{background:var(--teal-soft);color:var(--teal);font-weight:600}
.badge{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:6px;font-size:11px;font-weight:600;background:var(--surface);color:var(--muted)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.teal{background:var(--teal-soft);color:var(--teal)}
.badge.acc{background:var(--accent-soft);color:var(--accent)}
.card.dim{opacity:.55}

/* beauty list */
.rows{display:grid;gap:8px}
.row{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;text-align:left;width:100%}
.row .thumb{width:56px;height:56px;flex:none;border-radius:10px}
.row .meta{flex:1;min-width:0}
.row .meta b{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .side{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.alert{background:var(--warn-soft);border-radius:var(--r);padding:12px 14px;margin-bottom:14px}
.alert h3{margin:0 0 8px;font-size:14px;color:var(--warn)}
.alert .chips .chip{border-color:transparent}

.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty h3{font:700 17px var(--f-display);color:var(--ink);margin:0 0 6px}
.empty p{margin:0 auto 16px;max-width:30em}

/* outfits */
.ogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ocard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0 0 10px;text-align:left;overflow:hidden;min-width:0}
.ocard .ostage{background:var(--stage);aspect-ratio:3/4;max-width:100%;display:grid;place-items:center}
.ocard .ostage svg{height:94%;width:auto}
.ocard b{display:block;padding:8px 10px 2px;font-size:14px}
.ocard span{display:block;padding:0 10px;font-size:12px;color:var(--muted)}

/* dress up */
.dress{display:grid;gap:14px}
@media (min-width:760px){.dress{grid-template-columns:minmax(280px,380px) 1fr;align-items:start}.stage-card{position:sticky;top:calc(env(safe-area-inset-top,0px) + 120px)}}
.stage-card{background:var(--stage);border-radius:20px;padding:10px 10px 12px;position:relative}
.stage-card .avatar{display:block;margin:0 auto;height:min(52vh,430px);width:auto;max-width:100%}
.stage-name{position:absolute;left:14px;top:12px;font:700 15px var(--f-display)}
.stage-acts{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.panel{display:grid;gap:12px;min-width:0}
.slotchips .chip.has::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
.slotchips .chip.on.has::after{background:var(--bg)}
.tray{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.tile{display:flex;flex-direction:column;gap:4px;background:none;border:0;padding:0;text-align:center;font-size:12px;min-width:0}
.tile .thumb{border:2px solid transparent}
.tile.on .thumb{border-color:var(--accent)}
.tile .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wearing{display:flex;flex-wrap:wrap;gap:6px}
.editing{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--teal-soft);color:var(--teal);border-radius:12px;padding:8px 12px;font-size:13.5px}
.hint{font-size:12.5px;color:var(--muted);margin:0}

/* FAB + tabs */
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 78px);z-index:25;height:50px;padding:0 18px;border-radius:16px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;box-shadow:var(--shadow);display:flex;align-items:center;gap:6px}
.fab svg{width:20px;height:20px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs .in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:11.5px;color:var(--muted)}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--accent);font-weight:600}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:40;background:rgba(20,16,24,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:calc(100% - env(safe-area-inset-top,0px) - 24px);overflow-y:auto;border-radius:22px 22px 0 0;padding:6px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 18px) max(16px,env(safe-area-inset-left,0px));animation:up .22s ease-out;overscroll-behavior:contain}
@media (min-width:700px){.sheet-wrap{align-items:center}.sheet{border-radius:22px;max-height:90%;padding-bottom:20px}}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 6px}
.sheet-head{display:flex;align-items:center;gap:10px;position:sticky;top:-6px;background:var(--bg);padding-block:8px;z-index:2}
.sheet-head h2{flex:1;margin:0;font:700 19px var(--f-display)}
.field{display:grid;gap:7px;margin-block:14px}
.lbl{font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inputs .full{grid-column:1/-1}
.inp{display:grid;gap:5px;min-width:0}
.inp input,.inp select,.inp textarea,textarea.inp-area{width:100%;min-width:0;height:42px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 11px;outline:none}
.inp textarea,textarea.inp-area{height:auto;min-height:70px;padding:9px 11px;resize:vertical}
.inp input:focus,.inp select:focus,.inp textarea:focus{border-color:var(--accent)}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);padding:0;position:relative}
.sw.on{box-shadow:0 0 0 2px var(--accent)}
.sw-wrap{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--muted);width:42px;background:none;border:0;padding:0}
.photo-pick{display:flex;align-items:center;gap:14px;margin-top:6px}
.photo-box{width:108px;height:108px;flex:none;border-radius:14px;background:var(--tile);display:grid;place-items:center;overflow:hidden;cursor:pointer;position:relative;border:1px dashed var(--muted)}
.photo-box img{width:100%;height:100%;object-fit:cover}
.photo-box svg{width:70%;height:70%;opacity:.85}
.photo-box span{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:11.5px;color:var(--ink);font-weight:600}
.photo-side{display:grid;gap:6px;font-size:12.5px;color:var(--muted)}
.dup{border-radius:var(--r);padding:12px 14px;font-size:13.5px}
.dup.has{background:var(--warn-soft)}
.dup.none{background:var(--ok-soft);color:var(--ok)}
.dup p{margin:0 0 8px}
.dup p:last-child{margin:0}
.dup .mini{display:flex;gap:6px;overflow-x:auto}
.dup .mini .thumb{width:54px;height:54px;flex:none;border-radius:9px}
.dup .mini button{border:0;padding:0;background:none}
.sheet-actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.sheet-actions .btn{flex:1}

/* garment tag (detail) */
.tag{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:560px){.tag{grid-template-columns:200px 1fr}}
.tag .thumb{border-radius:16px}
.tag-card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 16px 14px}
.tag-card::before{content:"";position:absolute;top:12px;right:14px;width:12px;height:12px;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line)}
.tag-card h3{margin:0 0 2px;font:700 18px var(--f-display);padding-right:24px}
.tag-card .crumb{color:var(--muted);font-size:12.5px;margin:0 0 12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:13.5px;border-top:1px dashed var(--line);padding-top:10px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.stat-list{display:grid;gap:6px;font-size:13.5px}
.stat-list div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding-block:6px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 140px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1}
.hair-opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.hair-opts button{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:4px;font-size:12px}
.hair-opts button.on{border-color:var(--accent)}
.hair-opts svg{width:100%;height:auto;display:block}
.sub-note{font-size:12.5px;color:var(--muted);margin:6px 0 0}
</style>
</head><!--R-->
<body><!--R-->

<header class="top" id="top">
  <div class="wrap">
    <div class="top-row">
      <div class="brand"><h1>衣橱手账</h1><p id="topStat">记下你有的，就不会再买重复</p></div>
      <button class="icon-btn" data-action="settings" aria-label="统计与备份">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
      </button>
    </div>
    <div class="search-row">
      <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
        <input id="q" type="search" placeholder="搜名字、品牌、颜色、色号…" autocomplete="off" aria-label="搜索"></label>
      <button class="btn soft" data-action="check">买前查一查</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div id="banner"></div>
  <div id="view"></div>
</main>

<button class="fab" id="fab" data-action="fab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span id="fabLabel">添加</span></button>

<nav class="tabs" aria-label="主导航"><div class="in">
  <button class="tab" data-action="tab" data-tab="clothes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8.5V7.6a2.2 2.2 0 1 0-2.2-2.2"/><path d="M12 8.5l8.6 6.6c.9.7.4 2.1-.7 2.1H4.1c-1.1 0-1.6-1.4-.7-2.1z"/></svg>衣服</button>
  <button class="tab" data-action="tab" data-tab="skincare"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M12 3.2s6 6.4 6 10.9a6 6 0 0 1-12 0C6 9.6 12 3.2 12 3.2z"/></svg>护肤</button>

/* ============ storage (IndexedDB with fallback) ============ */
const DB={db:null,
  open(){return new Promise((res,rej)=>{try{const r=indexedDB.open('wardrobe-journal',1);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');if(!d.objectStoreNames.contains('photos'))d.createObjectStore('photos')};r.onsuccess=()=>{this.db=r.result;res(true)};r.onerror=()=>rej(r.error)}catch(e){rej(e)}})},
  req(store,mode,fn){return new Promise((res,rej)=>{if(!this.db)return res(null);try{const tx=this.db.transaction(store,mode);const st=tx.objectStore(store);const r=fn(st);tx.oncomplete=()=>res(r&&r.result);tx.onerror=()=>rej(tx.error)}catch(e){rej(e)}})},
  get(s,k){return this.req(s,'readonly',st=>st.get(k))},
  set(s,k,v){return this.req(s,'readwrite',st=>st.put(v,k))},
  del(s,k){return this.req(s,'readwrite',st=>st.delete(k))},
  clear(s){return this.req(s,'readwrite',st=>st.clear())},
  all(s){return new Promise((res,rej)=>{if(!this.db)return res([]);try{const out=[];const tx=this.db.transaction(s,'readonly');const c=tx.objectStore(s).openCursor();c.onsuccess=()=>{const cur=c.result;if(cur){out.push([cur.key,cur.value]);cur.continue()}};tx.oncomplete=()=>res(out);tx.onerror=()=>rej(tx.error)}catch(e){rej(e)}})}
};

/* ============ beauty expiry ============ */
function deadline(i){let d=null;if(i.expiry)d=new Date(i.expiry+'T00:00:00');if(i.opened&&i.pao){const o=new Date(i.opened+'T00:00:00');o.setMonth(o.getMonth()+Number(i.pao));if(!d||o<d)d=o}return d}
function daysLeft(i){const d=deadline(i);if(!d||isNaN(d))return null;const t=new Date();t.setHours(0,0,0,0);return Math.round((d-t)/864e5)}
function expiryBadge(i){if(isGone(i))return '';const n=daysLeft(i);if(n===null)return '';if(n<0)return '<span class="badge warn">已过期</span>';if(n<=60)return `<span class="badge warn">还剩 ${n} 天</span>`;const d=deadline(i);return `<span class="badge">到 ${d.getFullYear()}.${d.getMonth()+1}</span>`}

  if(i.kind!=='clothes')return null;
  return {top:'top',outer:'outer',pants:'bottom',skirt:'bottom',dress:'dress',shoes:'shoes',bag:'bag'}[i.cat]||(i.cat==='acc'?({'帽子':'hat','毛线帽':'hat','围巾':'scarf','眼镜墨镜':'glasses'}[i.sub]||null):null);
}
function shapeOf(i){
  const s=i.sub||'';

    case 'outer':return ['大衣','风衣'].includes(s)?'coat':['羽绒服','棉服'].includes(s)?'puffer':s==='马甲'?'vest':'jacket';
    case 'pants':return s==='短裤'?'shorts':s==='阔腿裤'?'wide':'pants';
    case 'skirt':return ['中长裙','A字裙'].includes(s)?'skirt-m':s==='长裙'?'skirt-l':s==='百褶裙'?'skirt-p':'skirt-s';

    case 'shoes':return ['短靴','长靴'].includes(s)?(s==='长靴'?'boots-l':'boots'):['高跟鞋','玛丽珍','平底鞋','乐福鞋'].includes(s)?'flats':['凉鞋','拖鞋'].includes(s)?'sandal':'sneaker';
    case 'bag':return s==='双肩包'?'backpack':['托特包','帆布包','手拿包'].includes(s)?'tote':'cross';
    case 'acc':return s==='毛线帽'?'beanie':s==='帽子'?'hat':s==='围巾'?'scarf':s==='眼镜墨镜'?'glasses':null;
  }
  return null;
}

function similar(d){
  if(!d.cat)return [];
  return S.items.filter(i=>i.id!==d.id&&i.kind===d.kind&&!isGone(i)&&i.cat===d.cat&&(!d.sub||i.sub===d.sub)).map(i=>({i,same:d.kind==='clothes'?(d.color&&i.color===d.color):(d.shade&&i.shade&&i.shade.toLowerCase()===d.shade.toLowerCase())})).sort((a,b)=>b.same-a.same);
}
function dupHTML(d,mode){

  const colorTxt=d.kind==='clothes'&&d.color&&COLOR[d.color]?COLOR[d.color].name:d.shade?('色号 '+d.shade):'';
  return `<div class="dup has"><p><b>你已经有 ${sim.length} ${KIND[d.kind].unit}「${esc(what)}」了</b>${same?`，其中 <b>${same} ${KIND[d.kind].unit}也是${esc(colorTxt)}</b>`:''}。${mode==='check'?'':'确定还要再添一件吗？'}</p><div class="mini">${sim.slice(0,12).map(({i})=>`<button data-action="open-item" data-id="${i.id}" title="${esc(itemName(i))}">${thumbHTML(i)}</button>`).join('')}</div></div>`;

function syncDraft(){

  const map={'f-name':'name','f-brand':'brand','f-price':'price','f-date':'date','f-size':'size','f-material':'material','f-shade':'shade','f-opened':'opened','f-pao':'pao','f-expiry':'expiry','f-note':'note'};

}
async function saveDraft(){
  syncDraft();const d=sheet.draft;
  if(d.kind==='clothes'&&!(d.seasons||[]).length)d.seasons=SEASONS.map(s=>s[0]);
  const isNew=!d.id;const id=d.id||uid();
  const old=getItem(id)||{};
  const item={...old,id,kind:d.kind,cat:d.cat,sub:d.sub,name:d.name,brand:d.brand,price:d.price,date:d.date,note:d.note,status:d.status};
  if(d.kind==='clothes')Object.assign(item,{color:d.color,seasons:d.seasons,size:d.size,material:d.material,wearCount:old.wearCount||0});
  else Object.assign(item,{shade:d.shade,hex:d.hex,opened:d.opened,pao:d.pao,expiry:d.expiry});
  if(isNew){item.created=Date.now();S.items.push(item)}
  if(d.photoNew){setPhoto(id,d.photoNew);DB.set('photos',id,d.photoNew).catch(()=>{storageOK=false;renderBanner()})}
  else if(d.photoRemoved)rmPhoto(id);
  save();closeSheet();render();toast(isNew?'已添加「'+itemName(item)+'」':'已保存');
}
function deleteItem(id){
  S.items=S.items.filter(i=>i.id!==id);rmPhoto(id);
  for(const k in S.wear)if(S.wear[k]===id)delete S.wear[k];
  S.outfits.forEach(o=>{for(const k in o.wear)if(o.wear[k]===id)delete o.wear[k];o.extras=(o.extras||[]).filter(x=>x!==id)});
  save();
}
function sheetItem(){

  const K=KIND[i.kind];const c=catOf(i);
  const rows=[];
  if(i.kind==='clothes'){rows.push(['颜色',COLOR[i.color]?COLOR[i.color].name:'—'],['季节',(i.seasons||[]).map(seasonName).join(' ')||'—'])}
  if(i.shade)rows.push(['色号',esc(i.shade)]);
  if(i.brand)rows.push(['品牌',esc(i.brand)]);
  if(i.price)rows.push(['价格',`<span class="mono">¥${esc(i.price)}</span>`]);
  if(i.date)rows.push(['购买',`<span class="mono">${esc(i.date)}</span>`]);
  if(i.size)rows.push(['尺码',esc(i.size)]);if(i.material)rows.push(['材质',esc(i.material)]);
  if(i.opened)rows.push(['开封',`<span class="mono">${esc(i.opened)}</span>${i.pao?` · 开封后 <span class="mono">${esc(i.pao)}M</span>`:''}`]);
  if(i.expiry)rows.push(['保质期到',`<span class="mono">${esc(i.expiry)}</span>`]);
  const dl=daysLeft(i);if(dl!==null&&!isGone(i))rows.push(['还能用',dl<0?'<b style="color:var(--warn)">已过期</b>':`<span class="mono">${dl}</span> 天`]);
  rows.push(['状态',esc(i.status)]);
  if(i.kind==='clothes')rows.push(['穿过',`<span class="mono">${i.wearCount||0}</span> 次${i.lastWorn?' · 上次 '+esc(i.lastWorn):''}`]);
  if(i.note)rows.push(['备注',esc(i.note)]);
  const inOut=S.outfits.filter(o=>Object.values(o.wear||{}).includes(i.id)||(o.extras||[]).includes(i.id));
  let h=head(K.label);
  h+=`<div class="tag">${thumbHTML(i)}<div class="tag-card"><h3>${esc(itemName(i))}</h3><p class="crumb">${esc(c.label)} › ${esc(i.sub||'')}${i.sample?' · 示例':''}</p><dl class="kv">${rows.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl></div></div>`;
  if(inOut.length)h+=`<div class="field"><span class="lbl">出现在这些搭配里</span><div class="chips">${inOut.map(o=>`<button class="chip" data-action="open-outfit" data-id="${o.id}">${esc(o.name)}</button>`).join('')}</div></div>`;
  h+=`<div class="sheet-actions">${i.kind==='clothes'&&!isGone(i)?'<button class="btn primary" data-action="worn-item">今天穿了 +1</button>':''}${slotOf(i)&&!isGone(i)?'<button class="btn soft" data-action="tryon">给小我试穿</button>':''}<button class="btn" data-action="edit-item">编辑</button></div>`;
  if(i.kind!=='clothes'&&i.status!=='用完了')h+=`<div class="sheet-actions"><button class="btn ghost" data-action="used-up">标记为用完了</button></div>`;
  return h;
}

function sheetSettings(){
  const cl=S.items.filter(i=>i.kind==='clothes'&&!isGone(i));
  const spend=S.items.reduce((s,i)=>s+(parseFloat(i.price)||0),0);
  const never=cl.filter(i=>!(i.wearCount>0));
  const top=cl.slice().sort((a,b)=>(b.wearCount||0)-(a.wearCount||0)).slice(0,3).filter(i=>i.wearCount>0);
  let h=head('统计与备份');
  h+=`<div class="field"><span class="lbl">衣橱统计</span><div class="stat-list">${KIND.clothes.cats.map(c=>{const n=cl.filter(i=>i.cat===c.key).length;return n?`<div><span>${c.label}</span><span class="mono">${n}</span></div>`:''}).join('')}<div><span>护肤品（未用完）</span><span class="mono">${S.items.filter(i=>i.kind==='skincare'&&!isGone(i)).length}</span></div><div><span>彩妆（未用完）</span><span class="mono">${S.items.filter(i=>i.kind==='makeup'&&!isGone(i)).length}</span></div><div><span>记录的总花费</span><span class="mono">¥${spend.toLocaleString('zh-CN',{maximumFractionDigits:0})}</span></div><div><span>一次都没穿过的衣物</span><span class="mono">${never.length}</span></div>${top.length?`<div><span>穿得最多</span><span>${top.map(i=>esc(itemName(i))+' ×'+i.wearCount).join('、')}</span></div>`:''}</div></div>`;
  h+=`<div class="field"><span class="lbl">备份（换手机、清浏览器之前一定要做）</span><p class="hint">所有记录只存在这台设备的这个浏览器里，不会上传到任何地方。定期导出一份备份文件，换设备时再导入。</p><div class="sheet-actions" style="margin-top:4px"><button class="btn" data-action="export-file">导出备份文件</button><button class="btn" data-action="export-copy">复制备份文本</button></div><div class="sheet-actions" style="margin-top:0"><label class="btn" for="import-file">从文件导入</label><input id="import-file" type="file" accept=".json,application/json" hidden></div><textarea class="inp-area" id="import-text" placeholder="或者把备份文本粘贴到这里，再点「从文本导入」"></textarea><div class="sheet-actions" style="margin-top:0"><button class="btn" data-action="import-text">从文本导入</button></div>${sheet.pendingImport?`<div class="dup has"><p>导入会<b>替换掉</b>现在的全部记录（${S.items.length} 件单品、${S.outfits.length} 套搭配）。</p><div class="sheet-actions" style="margin-top:0"><button class="btn primary" data-action="import-confirm">确定替换</button><button class="btn ghost" data-action="import-cancel">算了</button></div></div>`:''}</div>`;
  h+=`<div class="field"><span class="lbl">危险操作</span><div class="sheet-actions" style="margin-top:0"><button class="btn danger ${sheet.armed?'armed':''}" data-action="wipe">${sheet.armed?'真的全部清空？点这里确认':'清空所有记录'}</button></div></div>`;
  return h;
}

/* ============ actions ============ */
function setWear(slot,id){
  if(!id){delete S.wear[slot];return}
  S.wear[slot]=id;
  if(slot==='dress'){delete S.wear.top;delete S.wear.bottom}
  if(slot==='top'||slot==='bottom')delete S.wear.dress;
}
function randomOutfit(){
  const pick=a=>a.length?a[Math.floor(Math.random()*a.length)].id:null;
  const se=ui.dseason==='all'?curSeason():ui.dseason;
  const pool=slot=>S.items.filter(i=>!isGone(i)&&slotOf(i)===slot&&(i.kind!=='clothes'||(i.seasons||[]).includes(se)));
  const w={};const dresses=pool('dress'),tops=pool('top'),bottoms=pool('bottom');
  if(dresses.length&&(Math.random()<.35||!tops.length||!bottoms.length))w.dress=pick(dresses);else{if(tops.length)w.top=pick(tops);if(bottoms.length)w.bottom=pick(bottoms)}
  const outs=pool('outer');if(outs.length&&(se==='winter'||se==='autumn'||Math.random()<.4))w.outer=pick(outs);
  ['shoes','bag'].forEach(k=>{const p=pool(k);if(p.length&&(k==='shoes'||Math.random()<.7))w[k]=pick(p)});
  if(se==='winter'){const sc=pool('scarf');if(sc.length&&Math.random()<.6)w.scarf=pick(sc);const ht=pool('hat');if(ht.length&&Math.random()<.4)w.hat=pick(ht)}
  const lips=pool('lip');if(lips.length&&Math.random()<.8)w.lip=pick(lips);
  const bl=pool('blush');if(bl.length&&Math.random()<.6)w.blush=pick(bl);
  for(const k in w)if(!w[k])delete w[k];
  if(!Object.keys(w).length){toast(`${seasonName(se)}季还没有能穿的衣服`);return}
  S.wear=w;save();render();toast(`随机搭了一套${seasonName(se)}季的`);
}
function exportData(){return JSON.stringify({app:'wardrobe-journal',version:1,exportedAt:new Date().toISOString(),state:S,photos:Object.fromEntries(photoData)})}
function parseImport(txt){const o=JSON.parse(txt);if(!o||o.app!=='wardrobe-journal'||!o.state||!Array.isArray(o.state.items))throw new Error('bad');return o}
async function applyImport(o){
  S={...freshState(),...o.state};S.sample=false;
  for(const id of [...photoURL.keys()])rmPhoto(id);
  await DB.clear('photos').catch(()=>{});
  for(const [id,d] of Object.entries(o.photos||{})){setPhoto(id,d);await DB.set('photos',id,d).catch(()=>{})}
  save();
}
async function onClick(e){

  const a=el.dataset.action,val=el.dataset.val,id=el.dataset.id;
  if(el.tagName==='LABEL')return;
  switch(a){
    case 'tab':closeSheet();go(el.dataset.tab);break;
    case 'season':ui.season=val;render();break;
    case 'cat':ui.cat=val;ui.sub='all';render();break;
    case 'sub':ui.sub=val;render();break;
    case 'toggle-gone':ui.showGone=!ui.showGone;render();break;
    case 'bstatus':ui.bstatus[ui.tab]=val;render();break;
    case 'bcat':ui.bcat[ui.tab]=val;render();break;

      if(ui.tab==='outfits'){ui.editingOutfit=null;S.wear={};save();go('dressup');break}
      const kind=ui.tab==='skincare'||ui.tab==='makeup'?ui.tab:'clothes';const d=newDraft(kind);
      if(kind==='clothes'&&ui.cat!=='all'){d.cat=ui.cat;d.sub=ui.sub!=='all'?ui.sub:KIND.clothes.cats.find(c=>c.key===ui.cat).subs[0]}

    case 'close-sheet':closeSheet();break;
    case 'f-set':{syncDraft();const d=sheet.draft;d[el.dataset.field]=(el.dataset.field==='color'&&d.color===val)?'':val;if(el.dataset.field==='cat'){const c=KIND[d.kind].cats.find(x=>x.key===val);d.sub=c.subs[0]}sheet.armed=false;renderSheet();break}
    case 'f-season':{syncDraft();const d=sheet.draft;if(val==='all')d.seasons=SEASONS.map(s=>s[0]);else d.seasons=d.seasons.includes(val)?d.seasons.filter(s=>s!==val):[...d.seasons,val];renderSheet();break}

    case 'import-confirm':await applyImport(sheet.pendingImport);sheet.pendingImport=null;closeSheet();render();toast('导入完成');break;
    case 'import-cancel':sheet.pendingImport=null;renderSheet();break;
    case 'wipe':if(!sheet.armed){sheet.armed=true;renderSheet();break}for(const pid of [...photoURL.keys()])rmPhoto(pid);await DB.clear('photos').catch(()=>{});{const av=S.avatar;S=freshState();S.avatar=av}save();closeSheet();render();toast('已全部清空');break;
    case 'clear-sample':{const ids=S.items.filter(i=>i.sample).map(i=>i.id);ids.forEach(rmPhoto);S.items=S.items.filter(i=>!i.sample);S.outfits=S.outfits.filter(o=>!o.sample);S.wear={};S.sample=false;save();render();toast('示例已清空，点「添加衣服」开始吧');break}
    case 'keep-sample':S.sample=false;save();renderBanner();toast('示例保留着，随时可以在单品里删除');break;
  }
}
document.addEventListener('click',onClick);
document.addEventListener('change',async e=>{
  if(e.target.id==='f-photo'&&e.target.files[0]){syncDraft();try{sheet.draft.photoNew=await compress(e.target.files[0]);sheet.draft.photoRemoved=false;renderSheet()}catch(err){toast('这张图片读不出来，换一张试试')}}
  if(e.target.id==='import-file'&&e.target.files[0]){const t=await e.target.files[0].text();try{sheet.pendingImport=parseImport(t);renderSheet()}catch(err){toast('这个文件不是衣橱手账的备份')}}
});
function compress(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const max=900;const sc=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82))};img.onerror=rej;img.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}
$('#sheetWrap').addEventListener('click',e=>{if(e.target.id==='sheetWrap')closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheet)closeSheet()});
$('#q').addEventListener('input',e=>{ui.q=e.target.value;render()});
window.addEventListener('scroll',()=>$('#top').classList.toggle('scrolled',window.scrollY>4),{passive:true});
window.addEventListener('hashchange',()=>{const t=location.hash.slice(1);if(['clothes','skincare','makeup','outfits','dressup'].includes(t)&&t!==ui.tab){ui.tab=t;render()}});

/* ============ boot ============ */
(async function boot(){
  let st=null;
  try{await DB.open();st=await DB.get('kv','state');const ph=await DB.all('photos');ph.forEach(([k,v])=>setPhoto(k,v))}catch(e){storageOK=false}
  S=st&&Array.isArray(st.items)?{...freshState(),...st}:sampleState();
  if(!st)save();
  const t=location.hash.slice(1);if(['clothes','skincare','makeup','outfits','dressup'].includes(t))ui.tab=t;
  render();
  try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&document.querySelector('link[rel=manifest]'))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
})();
</script>
