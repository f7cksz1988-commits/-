<!doctype html><!--R-->
<html lang="zh-CN"><!--R-->
<head><!--R-->
<meta charset="utf-8"><!--R-->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><!--R-->
<title>我的衣柜</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="manifest.webmanifest"><!--R-->
<link rel="apple-touch-icon" href="icon-192.png"><!--R-->
<link rel="icon" href="icon.svg" type="image/svg+xml"><!--R-->
<meta name="apple-mobile-web-app-capable" content="yes"><!--R-->
<meta name="mobile-web-app-capable" content="yes"><!--R-->
<meta name="apple-mobile-web-app-title" content="我的衣柜"><!--R-->
<meta name="theme-color" content="#F5FAEE"><!--R-->
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><!--R-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=ZCOOL+KuaiLe&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-column phone app — sticky header, scrolling content, fixed bottom tab bar; widens to a centred 980px column on desktop. */
:root{
  --mascot-bg:transparent;
  --bg:#F5FAEE; --surface:#FFFFFF; --tile:#E9F3DC; --ink:#24361A; --muted:#6A7B5E; --line:#D8E8C5;
  --accent:#95CF55; --accent-ink:#18300A; --accent-soft:#E5F4D0; --accent-text:#4A8A1C;
  --teal:#2F7471; --teal-soft:#DCEFEC; --warn:#A9501C; --warn-soft:#FBE8DA; --ok:#2F7A2E; --ok-soft:#E0F2D8;
  --board:#FBFDF7; --board-dot:#E0EDCF; --shadow:0 1px 2px rgba(34,55,42,.05),0 6px 20px rgba(34,55,42,.08);
  --f-display:"Noto Serif SC","Songti SC","STSong",serif;
  --f-body:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --mascot-bg:#E4ECD8;
  --bg:#141A10; --surface:#1C2416; --tile:#26311E; --ink:#E9F2DF; --muted:#A2B293; --line:#314027;
  --accent:#8FCC4F; --accent-ink:#15260A; --accent-soft:#25381A; --accent-text:#A8DB70;
  --teal:#83C6C3; --teal-soft:#1D3433; --warn:#F2A473; --warn-soft:#3B2619; --ok:#86CFA2; --ok-soft:#1D3326;
  --board:#19210F; --board-dot:#2A3720; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --mascot-bg:#E4ECD8;
  --bg:#141A10; --surface:#1C2416; --tile:#26311E; --ink:#E9F2DF; --muted:#A2B293; --line:#314027;
  --accent:#8FCC4F; --accent-ink:#15260A; --accent-soft:#25381A; --accent-text:#A8DB70;
  --teal:#83C6C3; --teal-soft:#1D3433; --warn:#F2A473; --warn-soft:#3B2619; --ok:#86CFA2; --ok-soft:#1D3326;
  --board:#19210F; --board-dot:#2A3720; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}

html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid transparent}
.top.scrolled{border-bottom-color:var(--line)}
.top-row{display:flex;align-items:center;gap:12px;padding-block:12px 8px}
.brand{flex:1;min-width:0}
.brand h1{font:700 22px/1.2 var(--f-display);margin:0;letter-spacing:.02em}
.brand-line{display:flex;align-items:center;gap:8px;min-width:0}
.sync{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;border:0;font-size:11.5px;font-weight:600;background:var(--tile);color:var(--muted);white-space:nowrap}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.sync.ok{background:var(--ok-soft);color:var(--ok)}
.sync.busy{background:var(--teal-soft);color:var(--teal)}
.sync.bad{background:var(--warn-soft);color:var(--warn)}
.brand p{margin:2px 0 0;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);flex:none}
.icon-btn svg{width:20px;height:20px}
.search-row{display:flex;gap:8px;padding-block:0 10px}
.search{flex:1;min-width:0;position:relative}
.search svg{position:absolute;left:12px;top:50%;width:17px;height:17px;transform:translateY(-50%);color:var(--muted)}
.search input{width:100%;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 12px 0 36px;outline:none}
.search input:focus{border-color:var(--accent-text)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:42px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.soft{background:var(--accent-soft);color:var(--accent-text);border-color:transparent}
.btn.ghost{background:transparent}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn.danger.armed{background:var(--warn);color:var(--surface)}
.btn.sm{height:34px;padding:0 11px;font-size:13.5px;border-radius:10px}
.btn svg{width:17px;height:17px}
.link{background:none;border:0;color:var(--accent-text);padding:0;font-size:13.5px;text-decoration:underline;text-underline-offset:3px}

main{padding-block:4px 120px}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);color:var(--ink);border-radius:var(--r);padding:12px 14px;margin-block:4px 12px;font-size:13.5px}
.banner p{margin:0;flex:1 1 220px}
.banner .acts{display:flex;gap:8px}

/* chips */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;padding-block:2px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;white-space:nowrap}
.chip .n{font:500 11.5px var(--f-mono);color:var(--muted)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.on .n{color:inherit;opacity:.7}
.chip.sub{height:28px;font-size:12.5px;padding:0 10px;background:transparent}
.chip.sub.on{background:var(--accent-soft);color:var(--accent-text);border-color:var(--accent-text)}
.filters{display:grid;gap:8px;margin-block:4px 14px}

/* summary strip */
.summary{display:flex;gap:18px;flex-wrap:wrap;padding:12px 2px 14px;border-bottom:1px dashed var(--line);margin-bottom:12px}
.summary div{display:flex;flex-direction:column}
.summary b{font:500 22px/1.1 var(--f-mono);font-variant-numeric:tabular-nums}
.summary span{font-size:12px;color:var(--muted)}
.section-title{font:700 16px/1.3 var(--f-display);margin:18px 0 10px;display:flex;align-items:baseline;gap:8px}
.section-title small{font:400 12px var(--f-body);color:var(--muted)}

/* item grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
@media (min-width:640px){.grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}}
.card{display:flex;flex-direction:column;gap:6px;text-align:left;background:none;border:0;padding:0;min-width:0}
.thumb{position:relative;aspect-ratio:1;max-width:100%;width:100%;border-radius:12px;background:var(--tile);overflow:hidden;display:grid;place-items:center}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform-origin:50% 50%}
.thumb svg{width:78%;height:78%}
.thumb .badge{position:absolute;left:6px;top:6px}
.card .nm{font-size:13px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
.seasons{display:flex;gap:3px}
.seasons i{font-style:normal;font-size:10.5px;width:17px;height:17px;display:grid;place-items:center;border-radius:5px;color:var(--muted);background:var(--tile)}
.seasons i.on{background:var(--teal-soft);color:var(--teal);font-weight:600}
.badge{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:6px;font-size:11px;font-weight:600;background:var(--surface);color:var(--muted)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.teal{background:var(--teal-soft);color:var(--teal)}
.badge.acc{background:var(--accent-soft);color:var(--accent-text)}
.card.dim{opacity:.55}

/* beauty list */
.rows{display:grid;gap:8px}
.row{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;text-align:left;width:100%}
.row .thumb{width:56px;height:56px;flex:none;border-radius:10px}
.row .meta{flex:1;min-width:0}
.row .meta b{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .side{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.alert{background:var(--warn-soft);border-radius:var(--r);padding:12px 14px;margin-bottom:14px}
.alert h3{margin:0 0 8px;font-size:14px;color:var(--warn)}
.alert .chips .chip{border-color:transparent}

.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty h3{font:700 17px var(--f-display);color:var(--ink);margin:0 0 6px}
.empty p{margin:0 auto 16px;max-width:30em}

/* outfits */
.ogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ocard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0 0 10px;text-align:left;overflow:hidden;min-width:0}
.ocard .board{border-radius:0;border:0;border-bottom:1px solid var(--line)}
.ocard b{display:block;padding:8px 10px 2px;font-size:14px}
.ocard span{display:block;padding:0 10px;font-size:12px;color:var(--muted)}

/* outfit board */
.dress{display:grid;gap:14px}
@media (min-width:760px){.dress{grid-template-columns:minmax(300px,420px) 1fr;align-items:start}.board-col{position:sticky;top:calc(env(safe-area-inset-top,0px) + 120px)}}
.board-col{display:grid;gap:8px;min-width:0}
.board{position:relative;aspect-ratio:3/4;max-width:100%;width:100%;background-color:var(--board);background-image:radial-gradient(var(--board-dot) 1px,transparent 1.2px);background-size:16px 16px;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.board .pc{position:absolute;touch-action:none;user-select:none;-webkit-user-select:none}
.board .pc img{display:block;width:100%;height:auto;pointer-events:none;-webkit-user-drag:none}
.board .pc.photo img{border-radius:8px;box-shadow:0 1px 3px rgba(20,40,28,.18)}
.board .pc.cut img{filter:drop-shadow(0 2px 3px rgba(20,40,28,.18))}
.board .pc .ph{width:100%;aspect-ratio:1;background:var(--tile);border-radius:8px;display:grid;place-items:center}
.board .pc .ph svg{width:80%;height:80%}
.board:not(.live) .pc{touch-action:auto}
.board.live .pc{cursor:grab}
.board.live .pc.sel{outline:2px dashed var(--accent-text);outline-offset:3px}
.board .handle{position:absolute;right:-13px;bottom:-13px;width:28px;height:28px;border-radius:50%;background:var(--accent);border:2px solid var(--surface);box-shadow:var(--shadow);display:none;touch-action:none}
.board.live .pc.sel .handle{display:block}
.board-empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted);font-size:13.5px;pointer-events:none}
.ptools{display:flex;gap:6px;flex-wrap:wrap;min-height:34px;align-items:center}
.thumb.cutimg img{padding:6%}
.zoomwrap{display:grid;gap:6px;min-width:0}
.zoomwrap .thumb{touch-action:none;cursor:grab}
.zoomctl{display:flex;gap:8px;align-items:center}
.newsub{flex:1 1 140px;min-width:0;height:36px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 10px;outline:none}
.newsub:focus{border-color:var(--accent-text)}
.subrow{display:flex;gap:6px;align-items:center}
.subrow{min-width:0}
.subrow .newsub{flex:1 1 0;width:0}
.subrow .btn{flex:none}
.subrow .n{font:500 12px var(--f-mono);color:var(--muted);width:40px;text-align:right;flex:none}
.stat-list details{border-bottom:1px dashed var(--line)}
.stat-list summary{display:flex;justify-content:space-between;gap:10px;padding-block:8px;cursor:pointer;list-style:none}
.stat-list summary::-webkit-details-marker{display:none}
.stat-list summary::after{content:"›";color:var(--muted);transition:transform .15s}
.stat-list details[open] summary::after{transform:rotate(90deg)}
.stat-list summary span:first-child{flex:1}
.stat-sub{display:flex;flex-wrap:wrap;gap:6px;padding:0 0 10px}
.imp-row{display:grid;grid-template-columns:28px 72px 1fr;gap:10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.imp-row.off{opacity:.55}
.imp-row .thumb{width:72px;border-radius:10px}
.imp-row .thumb img{object-fit:contain}
.imp-check{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:var(--surface);font-weight:700;color:var(--accent-ink);padding:0}
.imp-check.on{background:var(--accent);border-color:var(--accent)}
.imp-fields{display:grid;gap:6px;min-width:0}
.imp-line{display:flex;gap:6px;align-items:center;min-width:0}
.imp-line .newsub{flex:1 1 0;width:0;min-width:0}
.imp-fields select.newsub{padding:0 6px}
.mascot{display:flex;gap:10px;align-items:center;margin:2px 0 14px}
.mascot-tap{background:none;border:0;padding:0;flex:none}
.mascot-art{width:84px;height:auto;display:block;background:var(--mascot-bg);border-radius:22px}
.mascot.small{margin:0 0 8px}
.mascot.small .mascot-art{width:64px;flex:none}
.bubble{position:relative;flex:1;min-width:0;background:var(--surface);border:2px solid var(--ink);border-radius:255px 18px 225px 18px/18px 225px 18px 255px;padding:10px 14px;font-family:"ZCOOL KuaiLe",var(--f-body);font-size:15.5px;line-height:1.5}
.bubble::before{content:"";position:absolute;left:-9px;top:50%;width:14px;height:14px;background:var(--surface);border-left:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:translateY(-50%) rotate(45deg);border-radius:0 0 0 4px}
.bubble p{margin:0}
.bubble-acts{display:flex;gap:14px;margin-top:4px;font-family:var(--f-body)}
.bubble-acts .link{font-size:12px;color:var(--muted)}
.mascot-art.wiggle{animation:wig .5s ease}
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}60%{transform:rotate(6deg)}}
@media (prefers-reduced-motion:reduce){.mascot-art.wiggle{animation:none}}
.frame{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.frame .thumb{width:150px;flex:none;cursor:grab;touch-action:none;border:1px dashed var(--muted)}
.frame-side{display:grid;gap:8px;flex:1 1 160px;min-width:0}
.panel{display:grid;gap:12px;min-width:0}
.tray{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.tile{display:flex;flex-direction:column;gap:4px;background:none;border:0;padding:0;text-align:center;font-size:12px;min-width:0}
.tile .thumb{border:2px solid transparent}
.tile.on .thumb{border-color:var(--accent-text)}
.tile .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wearing{display:flex;flex-wrap:wrap;gap:6px}
.editing{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--teal-soft);color:var(--teal);border-radius:12px;padding:8px 12px;font-size:13.5px}
.hint{font-size:12.5px;color:var(--muted);margin:0}

/* FAB + tabs */
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 78px);z-index:25;height:50px;padding:0 18px;border-radius:16px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;box-shadow:var(--shadow);display:flex;align-items:center;gap:6px}
.fab svg{width:20px;height:20px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs .in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:11.5px;color:var(--muted)}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--accent-text);font-weight:600}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:40;background:rgba(20,16,24,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:calc(100% - env(safe-area-inset-top,0px) - 24px);overflow-y:auto;border-radius:22px 22px 0 0;padding:6px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 18px) max(16px,env(safe-area-inset-left,0px));animation:up .22s ease-out;overscroll-behavior:contain;overflow-x:hidden}
@media (min-width:700px){.sheet-wrap{align-items:center}.sheet{border-radius:22px;max-height:90%;padding-bottom:20px}}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 6px}
.sheet-head{display:flex;align-items:center;gap:10px;position:sticky;top:-6px;background:var(--bg);padding-block:8px;z-index:2}
.sheet-head h2{flex:1;margin:0;font:700 19px var(--f-display)}
.field{display:grid;gap:7px;margin-block:14px}
.lbl{font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inputs .full{grid-column:1/-1}
.inp{display:grid;gap:5px;min-width:0}
.inp input,.inp select,.inp textarea,textarea.inp-area{width:100%;min-width:0;height:42px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 11px;outline:none}
.inp textarea,textarea.inp-area{height:auto;min-height:70px;padding:9px 11px;resize:vertical}
.inp input:focus,.inp select:focus,.inp textarea:focus{border-color:var(--accent-text)}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);padding:0;position:relative}
.sw.on{box-shadow:0 0 0 2px var(--accent-text)}
.sw-wrap{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--muted);width:42px;background:none;border:0;padding:0}
.photo-pick{display:flex;align-items:center;gap:14px;margin-top:6px}
.photo-box{width:108px;height:108px;flex:none;border-radius:14px;background:var(--tile);display:grid;place-items:center;overflow:hidden;cursor:pointer;position:relative;border:1px dashed var(--muted)}
.photo-box img{width:100%;height:100%;object-fit:cover}
.photo-box svg{width:70%;height:70%;opacity:.85}
.photo-box span{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:11.5px;color:var(--ink);font-weight:600}
.photo-side{display:grid;gap:6px;font-size:12.5px;color:var(--muted)}
.dup{border-radius:var(--r);padding:12px 14px;font-size:13.5px}
.dup.has{background:var(--warn-soft)}
.dup.none{background:var(--ok-soft);color:var(--ok)}
.dup p{margin:0 0 8px}

<script>
'use strict';
/* ============ constants ============ */
const SEASONS=[['spring','春'],['summer','夏'],['autumn','秋'],['winter','冬']];
const COLORS=[['black','黑色','#232326'],['white','白色','#F8F8F4'],['grey','灰色','#9C9CA3'],['cream','米白','#EFE4CF'],['khaki','卡其','#C9B48A'],['camel','驼色','#B98A5C'],['brown','棕色','#74503A'],['red','红色','#CF3539'],['wine','酒红','#7A1E36'],['pink','粉色','#F2A9C0'],['orange','橙色','#EC8838'],['yellow','黄色','#F1CF4A'],['green','绿色','#6FA96B'],['olive','墨绿','#34503F'],['skyblue','浅蓝','#A8CCEA'],['blue','蓝色','#3D6CC0'],['navy','藏青','#27345B'],['denim','牛仔蓝','#5A7AA5'],['purple','紫色','#9A7AC3'],['metal','金银','#C8B47E'],['multi','花色','multi']];
const COLOR=Object.fromEntries(COLORS.map(c=>[c[0],{name:c[1],hex:c[2]}]));
const KIND={
  clothes:{label:'衣服',unit:'件',status:['在穿','闲置','已处理'],gone:'已处理',cats:[
    {key:'top',label:'上衣',subs:['T恤','衬衫','背心吊带','卫衣','毛衣针织','打底衫','Polo衫','雪纺衫']},
    {key:'outer',label:'外套',subs:['西装','夹克','风衣','大衣','羽绒服','棉服','皮衣','牛仔外套','针织开衫','马甲','防晒衣']},
    {key:'pants',label:'裤子',subs:['牛仔裤','休闲裤','西裤','阔腿裤','运动裤','工装裤','打底裤','短裤']},
    {key:'skirt',label:'半身裙',subs:['短裙','中长裙','长裙','百褶裙','A字裙','包臀裙','牛仔裙']},
    {key:'dress',label:'连衣裙',subs:['短款连衣裙','中长连衣裙','长款连衣裙','吊带裙','衬衫裙','针织裙','连体裤']},
    {key:'shoes',label:'鞋子',subs:['运动鞋','帆布鞋','板鞋','乐福鞋','玛丽珍','高跟鞋','平底鞋','短靴','长靴','凉鞋','拖鞋']},
    {key:'bag',label:'包包',subs:['托特包','斜挎包','腋下包','双肩包','手拿包','帆布包']},
    {key:'acc',label:'配饰',subs:['帽子','毛线帽','围巾','眼镜墨镜','腰带','项链','耳饰','手链戒指','发饰','手套']},
    {key:'inner',label:'内搭家居',subs:['内衣','袜子','家居服','睡衣','泳衣','运动服']}]},
  skincare:{label:'护肤品',unit:'件',status:['在用','囤货','用完了'],gone:'用完了',cats:[
    {key:'clean',label:'清洁卸妆',subs:['卸妆油','卸妆水','卸妆膏','洁面','清洁面膜']},
    {key:'toner',label:'水',subs:['化妆水','爽肤水','湿敷水','喷雾']},
    {key:'serum',label:'精华',subs:['精华液','安瓶','精华油']},
    {key:'eye',label:'眼部',subs:['眼霜','眼部精华']},
    {key:'moist',label:'乳霜',subs:['乳液','面霜','凝露','面油']},
    {key:'sun',label:'防晒隔离',subs:['防晒霜','防晒喷雾','隔离']},
    {key:'mask',label:'面膜',subs:['贴片面膜','涂抹面膜','睡眠面膜']},
    {key:'body',label:'身体头发',subs:['身体乳','沐浴露','护手霜','洗发水','护发素','发膜']},
    {key:'lipcare',label:'唇部',subs:['润唇膏','唇膜']},
    {key:'other',label:'其他',subs:['香水','美容仪','其他']}]},
  makeup:{label:'彩妆',unit:'件',status:['在用','囤货','用完了'],gone:'用完了',cats:[
    {key:'base',label:'底妆',subs:['妆前乳','粉底液','气垫','粉霜','遮瑕','散粉蜜粉','粉饼','定妆喷雾']},
    {key:'eyes',label:'眼妆',subs:['眼影','眼线','睫毛膏','眉笔','眉粉','染眉膏','卧蚕笔','假睫毛']},
    {key:'cheek',label:'腮红修容',subs:['腮红','高光','修容']},
    {key:'lips',label:'唇妆',subs:['口红','唇釉','唇泥','唇蜜','唇线笔']},
    {key:'tools',label:'工具',subs:['化妆刷','美妆蛋','粉扑','睫毛夹']},
    {key:'nail',label:'美甲',subs:['指甲油','甲片']}]}
};
const OCCASIONS=['通勤','上课','约会','逛街','休闲','运动','旅行','聚会','正式'];
const BOARD_CATS=[['top','上衣'],['outer','外套'],['bottom','下装'],['dress','连衣裙'],['shoes','鞋子'],['bag','包包'],['acc','配饰'],['inner','内搭家居'],['beauty','美妆']];
const LAYOUT={outer:{x:4,y:3,w:42},top:{x:52,y:3,w:42},dress:{x:52,y:3,w:44},bottom:{x:30,y:37,w:40},shoes:{x:4,y:71,w:34},bag:{x:60,y:67,w:34},acc:{x:4,y:42,w:24},inner:{x:4,y:42,w:24},beauty:{x:74,y:40,w:20}};

/* ============ utils ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const curSeason=()=>{const m=new Date().getMonth()+1;return m>=3&&m<=5?'spring':m<=8&&m>=6?'summer':m>=9&&m<=11?'autumn':'winter'};
const seasonName=k=>(SEASONS.find(s=>s[0]===k)||[])[1]||'';
function darken(hex,a){if(!hex||hex[0]!=='#')return '#6c6470';let n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;const f=x=>Math.max(0,Math.round(x*(1-a)));return '#'+((1<<24)+(f(r)<<16)+(f(g)<<8)+f(b)).toString(16).slice(1)}
function lum(hex){if(!hex||hex[0]!=='#')return .5;const n=parseInt(hex.slice(1),16);return((n>>16)*.299+(n>>8&255)*.587+(n&255)*.114)/255}
function catOf(i){return (KIND[i.kind].cats.find(c=>c.key===i.cat))||{label:'',subs:[]}}
function subsOf(kind,cat){const c=S&&S.custom&&S.custom[kind]&&S.custom[kind][cat];if(Array.isArray(c))return c;const k=KIND[kind].cats.find(x=>x.key===cat);return k?k.subs:[]}
function setSubs(kind,cat,list){S.custom=S.custom||{};S.custom[kind]=S.custom[kind]||{};S.custom[kind][cat]=list;save()}
function subsWithUsed(kind,cat){const l=[...subsOf(kind,cat)];S.items.forEach(i=>{if(i.kind===kind&&i.cat===cat&&i.sub&&!l.includes(i.sub))l.push(i.sub)});return l}
function itemName(i){if(i.name)return i.name;const c=i.kind==='clothes'&&COLOR[i.color]?COLOR[i.color].name:'';return c+(i.sub||catOf(i).label)}
function isGone(i){return i.status===KIND[i.kind].gone}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2000)}
function dataURLtoBlob(d){const [h,b]=d.split(',');const mime=(h.match(/:(.*?);/)||[])[1]||'image/jpeg';const bin=atob(b);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:mime})}

/* ============ storage (IndexedDB with fallback) ============ */
const DB={db:null,
  open(){return new Promise((res,rej)=>{try{const r=indexedDB.open('wardrobe-journal',1);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');if(!d.objectStoreNames.contains('photos'))d.createObjectStore('photos')};r.onsuccess=()=>{this.db=r.result;res(true)};r.onerror=()=>rej(r.error)}catch(e){rej(e)}})},
  req(store,mode,fn){return new Promise((res,rej)=>{if(!this.db)return res(null);try{const tx=this.db.transaction(store,mode);const st=tx.objectStore(store);const r=fn(st);tx.oncomplete=()=>res(r&&r.result);tx.onerror=()=>rej(tx.error)}catch(e){rej(e)}})},
  get(s,k){return this.req(s,'readonly',st=>st.get(k))},
  set(s,k,v){return this.req(s,'readwrite',st=>st.put(v,k))},
  del(s,k){return this.req(s,'readwrite',st=>st.delete(k))},
  clear(s){return this.req(s,'readwrite',st=>st.clear())},
  all(s){return new Promise((res,rej)=>{if(!this.db)return res([]);try{const out=[];const tx=this.db.transaction(s,'readonly');const c=tx.objectStore(s).openCursor();c.onsuccess=()=>{const cur=c.result;if(cur){out.push([cur.key,cur.value]);cur.continue()}};tx.oncomplete=()=>res(out);tx.onerror=()=>rej(tx.error)}catch(e){rej(e)}})}
};
let S=null; const photoData=new Map(), photoURL=new Map(); let storageOK=true;
function setPhoto(id,data){photoData.set(id,data);if(photoURL.has(id))URL.revokeObjectURL(photoURL.get(id));try{photoURL.set(id,URL.createObjectURL(dataURLtoBlob(data)))}catch(e){photoURL.set(id,data)}}
function rmPhoto(id){photoData.delete(id);if(photoURL.has(id))URL.revokeObjectURL(photoURL.get(id));photoURL.delete(id);DB.del('photos',id).catch(()=>{})}
let saveT;function save(){if(Cloud.on){Cloud.dirty=true;clearTimeout(saveT);saveT=setTimeout(flush,400);setStatus();return}Cloud.localHad=true;clearTimeout(saveT);saveT=setTimeout(()=>{DB.set('kv','state',JSON.parse(JSON.stringify(S))).catch(()=>{storageOK=false;renderBanner()})},250)}

/* ============ cloud sync (Claude artifact db + assets) ============ */
const Cloud={on:false,col:null,assets:null,synced:new Map(),dirty:false,writing:false,again:false,lastSnap:null,status:'local',ephemeral:false,localHad:false};
function stable(v){if(Array.isArray(v))return '['+v.map(stable).join(',')+']';if(v&&typeof v==='object')return '{'+Object.keys(v).filter(k=>v[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+stable(v[k])).join(',')+'}';return JSON.stringify(v===undefined?null:v)}
function docsFromState(){const m=new Map();m.set('profile',{board:S.board||{pieces:[]},custom:S.custom||{},sample:!!S.sample,v:2});S.items.forEach(i=>m.set('item-'+i.id,i));S.outfits.forEach(o=>m.set('outfit-'+o.id,o));return m}
async function retry(fn){for(let n=0;;n++){try{return await fn()}catch(e){if(e&&(e.code==='resource_exhausted'||e.code==='unavailable')&&n<5){await new Promise(r=>setTimeout(r,900*(n+1)+Math.random()*500));continue}throw e}}}
async function flush(){
  if(!Cloud.on)return;
  if(Cloud.writing){Cloud.again=true;return}
  Cloud.writing=true;Cloud.dirty=false;setStatus();
  try{
    if(Cloud.ephemeral){Cloud.ephemeral=false;Cloud.synced=new Map()}
    const want=docsFromState();
    for(const [k,v] of want){const js=stable(v);if(Cloud.synced.get(k)!==js){await retry(()=>Cloud.col.doc(k).set(JSON.parse(js)));Cloud.synced.set(k,js)}}

function randomOutfit(){

  const pool=sl=>S.items.filter(i=>!isGone(i)&&i.kind==='clothes'&&boardSlot(i)===sl&&(i.seasons||[]).includes(se));
  const ids=[];const dresses=pool('dress'),tops=pool('top'),bottoms=pool('bottom');
  const outs=pool('outer');if(outs.length&&(se==='winter'||se==='autumn'||Math.random()<.4))ids.push(pick(outs));
  if(dresses.length&&(Math.random()<.35||!tops.length||!bottoms.length))ids.push(pick(dresses));else{if(tops.length)ids.push(pick(tops));if(bottoms.length)ids.push(pick(bottoms))}

  drag={pc,p,r,sx:e.clientX,sy:e.clientY,ox:p.x,oy:p.y,ow:p.w,mode:e.target.classList.contains('handle')?'size':'move',moved:false};

document.addEventListener('pointermove',e=>{

  if(Math.abs(dx)+Math.abs(dy)>.4)drag.moved=true;
  if(drag.mode==='move'){p.x=Math.round(Math.max(-30,Math.min(95,drag.ox+dx))*10)/10;p.y=Math.round(Math.max(-30,Math.min(95,drag.oy+dy))*10)/10;pc.style.left=p.x+'%';pc.style.top=p.y+'%'}

});

function cropBox(im,b){

  if(x1<x0)[x0,x1]=[x1,x0];if(y1<y0)[y0,y1]=[y1,y0];
  const W=im.naturalWidth,H=im.naturalHeight;let sx=x0/1000*W,sy=y0/1000*H,sw=(x1-x0)/1000*W,sh=(y1-y0)/1000*H;
  if(sw<8||sh<8)return null;const pad=Math.max(sw,sh)*.02;sx=Math.max(0,sx-pad);sy=Math.max(0,sy-pad);sw=Math.min(W-sx,sw+2*pad);sh=Math.min(H-sy,sh+2*pad);
  const sc=Math.min(1,700/Math.max(sw,sh));const c=document.createElement('canvas');c.width=Math.round(sw*sc);c.height=Math.round(sh*sc);
  const cx=c.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,c.width,c.height);cx.drawImage(im,sx,sy,sw,sh,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.88);
}

  rows.forEach(r=>{const k=impKeyOf(r);r.dupOld=seen.has(k);r.dupHere=here.has(k);if(r.dupOld||r.dupHere)r.on=false;here.add(k)});

async function runImport(files){

  impCtl=new AbortController();sheet.stage='reading';sheet.done=0;sheet.total=files.length;sheet.errs=[];renderSheet();
  for(let n=0;n<files.length;n++){
    if(!sheet||sheet.type!=='import'||impCtl.signal.aborted)break;
    sheet.done=n;sheet.note='';renderSheet();
    try{
      const im=await fileToImage(files[n]);
      const c=document.createElement('canvas');const sc=Math.min(1,2400/Math.max(im.naturalWidth,im.naturalHeight));c.width=Math.round(im.naturalWidth*sc);c.height=Math.round(im.naturalHeight*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.9));
      const out=await sample.json(importPrompt(),{images:[blob],signal:impCtl.signal});
      const items=Array.isArray(out&&out.items)?out.items:[];
      if(!items.length)sheet.errs.push(`第 ${n+1} 张没找到商品`);
      items.forEach(r=>sheet.rows.push(normRow(r,cropBox(im,r.bbox))));

      if(e&&e.code==='cancelled')break;
      const msg={not_granted:'你没有允许页面使用 Claude，没法识别截图',images_unavailable:'这里不能发送图片给 Claude',image_rejected:'这张图片格式不支持',rate_limited:'用得太频繁了，过一会儿再试',invalid_json:'识别结果看不懂',refused:'Claude 没有识别这张图'}[e&&e.code]||'识别失败';
      sheet.errs.push(`第 ${n+1} 张：${msg}`);if(e&&(e.code==='not_granted'||e.code==='images_unavailable'||e.code==='rate_limited'))break;

function cutRedraw(x0=0,y0=0,x1=Cut.w,y1=Cut.h){

function cutPush(){if(!Cut.ready)return;Cut.undo.push(Cut.mask.slice());if(Cut.undo.length>12)Cut.undo.shift()}
function cutUndo(){const m=Cut.undo.pop();if(!m){toast('没有可以撤销的了');return}Cut.mask=m;cutRedraw()}
/* plain-background cutout: flood fill from the edges over pixels close to the background colour */
function cutWhite(){
  if(!Cut.ready||Cut.busy)return;cutPush();
  const {w,h}=Cut,d=Cut.orig.data,tol=+$('#cutTol').value;
  const hist=new Map();const add=i=>{const k=(d[i*4]>>4)<<8|(d[i*4+1]>>4)<<4|(d[i*4+2]>>4);hist.set(k,(hist.get(k)||0)+1)};

  let best=0,bk=0;hist.forEach((v,k)=>{if(v>best){best=v;bk=k}});
  let br=0,bgc=0,bb=0,n=0;const chk=i=>{const k=(d[i*4]>>4)<<8|(d[i*4+1]>>4)<<4|(d[i*4+2]>>4);if(k===bk){br+=d[i*4];bgc+=d[i*4+1];bb+=d[i*4+2];n++}};
  for(let x=0;x<w;x++){chk(x);chk((h-1)*w+x)}for(let y=0;y<h;y++){chk(y*w);chk(y*w+w-1)}

function soften(m,w,h){const o=new Uint8ClampedArray(w*h);for(let y=0;y<h;y++)for(let x=0;x<w;x++){let s=0,n=0;for(let dy=-1;dy<=1;dy++){const yy=y+dy;if(yy<0||yy>=h)continue;for(let dx=-1;dx<=1;dx++){const xx=x+dx;if(xx<0||xx>=w)continue;s+=m[yy*w+xx];n++}}o[y*w+x]=s/n}return o}
/* smart cutout: U²-Net (u2netp) running in the browser with onnxruntime-web; nothing is uploaded */
let ortSession=null;
async function modelBytes(){
  try{const r=await fetch('vendor/u2netp.onnx');const ct=r.headers.get('content-type')||'';if(r.ok&&!/html|text/.test(ct))return new Uint8Array(await r.arrayBuffer())}catch(e){}

  const r=await fetch('vendor/u2netp.onnx.b64.txt');if(!r.ok)throw new Error('model missing');
  const bin=atob((await r.text()).trim());const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;

function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function getSession(){

  ort.env.wasm.numThreads=1;ort.env.wasm.proxy=false;ort.env.wasm.wasmPaths=new URL('vendor/',location.href).href;

function cutPoint(e){const r=$('#cutCanvas').getBoundingClientRect();return{x:(e.clientX-r.left)*Cut.w/r.width,y:(e.clientY-r.top)*Cut.h/r.height,s:Cut.w/r.width}}
function dab(x,y,rad){
  const {w,h,mask}=Cut,er=Cut.mode==='erase';const x0=Math.max(0,Math.floor(x-rad)),x1=Math.min(w,Math.ceil(x+rad+1)),y0=Math.max(0,Math.floor(y-rad)),y1=Math.min(h,Math.ceil(y+rad+1));
  for(let yy=y0;yy<y1;yy++)for(let xx=x0;xx<x1;xx++){const dd=Math.hypot(xx-x,yy-y);if(dd>rad)continue;const f=Math.min(1,(rad-dd)/(rad*.35));const i=yy*w+xx;mask[i]=er?Math.min(mask[i],255*(1-f)):Math.max(mask[i],255*f)}
  return [x0,y0,x1,y1];
}
const cvs=document.getElementById('cutCanvas');
cvs.addEventListener('pointerdown',e=>{if(!Cut.ready||Cut.busy)return;e.preventDefault();cutPush();const p=cutPoint(e);brush={...p,rad:(+$('#cutSize').value)*p.s};try{cvs.setPointerCapture(e.pointerId)}catch(err){}const b=dab(p.x,p.y,brush.rad);cutRedraw(...b)});
cvs.addEventListener('pointermove',e=>{if(!brush)return;const p=cutPoint(e);const dist=Math.hypot(p.x-brush.x,p.y-brush.y),step=Math.max(1,brush.rad/3),n=Math.ceil(dist/step);let bx0=1e9,by0=1e9,bx1=0,by1=0;
  for(let k=1;k<=n;k++){const t=k/n;const b=dab(brush.x+(p.x-brush.x)*t,brush.y+(p.y-brush.y)*t,brush.rad);bx0=Math.min(bx0,b[0]);by0=Math.min(by0,b[1]);bx1=Math.max(bx1,b[2]);by1=Math.max(by1,b[3])}
  if(n)cutRedraw(bx0,by0,bx1,by1);brush.x=p.x;brush.y=p.y});
const endBrush=()=>{brush=null};cvs.addEventListener('pointerup',endBrush);cvs.addEventListener('pointercancel',endBrush);
function cutFinish(){
  if(!Cut.ready)return;const {w,h,mask}=Cut;let x0=w,y0=h,x1=-1,y1=-1;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(mask[y*w+x]>12){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
  if(x1<0){cutStatus('整张图都被擦掉了，点「还原原图」重新来。');return}
  const pad=Math.round(Math.max(x1-x0,y1-y0)*.03);x0=Math.max(0,x0-pad);y0=Math.max(0,y0-pad);x1=Math.min(w-1,x1+pad);y1=Math.min(h-1,y1+pad);
  const bw=x1-x0+1,bh=y1-y0+1,sc=Math.min(1,900/Math.max(bw,bh));const c=document.createElement('canvas');c.width=Math.round(bw*sc);c.height=Math.round(bh*sc);
  c.getContext('2d').drawImage($('#cutCanvas'),x0,y0,bw,bh,0,0,c.width,c.height);
  let url=c.toDataURL('image/webp',.9);if(!url.startsWith('data:image/webp'))url=c.toDataURL('image/png');
  const cb=Cut.onDone;closeCut();cb&&cb(url);
}

/* ============ boot ============ */
(async function boot(){
  let st=null;
  try{await DB.open();st=await DB.get('kv','state');const ph=await DB.all('photos');ph.forEach(([k,v])=>setPhoto(k,v))}catch(e){storageOK=false}
  Cloud.localHad=!!(st&&Array.isArray(st.items));
  S=Cloud.localHad?normalizeState({...freshState(),...st}):freshState();
  if(purgeSamples(S))save();
  const t=location.hash.slice(1);if(['clothes','skincare','makeup','outfits','board'].includes(t))ui.tab=t;
  render();setStatus();connectCloud();
  setTimeout(()=>{if(Cloud.status!=='connecting')ensureDisps()},4000);
  try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&document.querySelector('link[rel=manifest]'))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
})();
</script>
