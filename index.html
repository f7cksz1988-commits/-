<!doctype html><!--R-->
<html lang="zh-CN"><!--R-->
<head><!--R-->

<link rel="manifest" href="manifest.webmanifest"><!--R-->

<link rel="icon" href="icon.svg" type="image/svg+xml"><!--R-->

<meta name="mobile-web-app-capable" content="yes"><!--R-->

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><!--R-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-column phone app — sticky header, scrolling content, fixed bottom tab bar; widens to a centred 980px column on desktop. */
:root{
  --bg:#F5FAEE; --surface:#FFFFFF; --tile:#E9F3DC; --ink:#24361A; --muted:#6A7B5E; --line:#D8E8C5;
  --accent:#95CF55; --accent-ink:#18300A; --accent-soft:#E5F4D0; --accent-text:#4A8A1C;
  --teal:#2F7471; --teal-soft:#DCEFEC; --warn:#A9501C; --warn-soft:#FBE8DA; --ok:#2F7A2E; --ok-soft:#E0F2D8;
  --board:#FBFDF7; --board-dot:#E0EDCF; --shadow:0 1px 2px rgba(34,55,42,.05),0 6px 20px rgba(34,55,42,.08);
  --f-display:"Noto Serif SC","Songti SC","STSong",serif;
  --f-body:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141A10; --surface:#1C2416; --tile:#26311E; --ink:#E9F2DF; --muted:#A2B293; --line:#314027;
  --accent:#8FCC4F; --accent-ink:#15260A; --accent-soft:#25381A; --accent-text:#A8DB70;
  --teal:#83C6C3; --teal-soft:#1D3433; --warn:#F2A473; --warn-soft:#3B2619; --ok:#86CFA2; --ok-soft:#1D3326;
  --board:#19210F; --board-dot:#2A3720; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141A10; --surface:#1C2416; --tile:#26311E; --ink:#E9F2DF; --muted:#A2B293; --line:#314027;
  --accent:#8FCC4F; --accent-ink:#15260A; --accent-soft:#25381A; --accent-text:#A8DB70;
  --teal:#83C6C3; --teal-soft:#1D3433; --warn:#F2A473; --warn-soft:#3B2619; --ok:#86CFA2; --ok-soft:#1D3326;
  --board:#19210F; --board-dot:#2A3720; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}

html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid transparent}
.top.scrolled{border-bottom-color:var(--line)}
.top-row{display:flex;align-items:center;gap:12px;padding-block:12px 8px}
.brand{flex:1;min-width:0}
.brand h1{font:700 22px/1.2 var(--f-display);margin:0;letter-spacing:.02em}
.brand-line{display:flex;align-items:center;gap:8px;min-width:0}
.sync{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;border:0;font-size:11.5px;font-weight:600;background:var(--tile);color:var(--muted);white-space:nowrap}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.sync.ok{background:var(--ok-soft);color:var(--ok)}
.sync.busy{background:var(--teal-soft);color:var(--teal)}
.sync.bad{background:var(--warn-soft);color:var(--warn)}
.brand p{margin:2px 0 0;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);flex:none}
.icon-btn svg{width:20px;height:20px}
.search-row{display:flex;gap:8px;padding-block:0 10px}
.search{flex:1;min-width:0;position:relative}
.search svg{position:absolute;left:12px;top:50%;width:17px;height:17px;transform:translateY(-50%);color:var(--muted)}
.search input{width:100%;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 12px 0 36px;outline:none}
.search input:focus{border-color:var(--accent-text)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:42px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.soft{background:var(--accent-soft);color:var(--accent-text);border-color:transparent}
.btn.ghost{background:transparent}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn.danger.armed{background:var(--warn);color:var(--surface)}
.btn.sm{height:34px;padding:0 11px;font-size:13.5px;border-radius:10px}
.btn svg{width:17px;height:17px}
.link{background:none;border:0;color:var(--accent-text);padding:0;font-size:13.5px;text-decoration:underline;text-underline-offset:3px}

main{padding-block:4px 120px}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);color:var(--ink);border-radius:var(--r);padding:12px 14px;margin-block:4px 12px;font-size:13.5px}
.banner p{margin:0;flex:1 1 220px}
.banner .acts{display:flex;gap:8px}

/* chips */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;padding-block:2px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;white-space:nowrap}
.chip .n{font:500 11.5px var(--f-mono);color:var(--muted)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.on .n{color:inherit;opacity:.7}
.chip.sub{height:28px;font-size:12.5px;padding:0 10px;background:transparent}
.chip.sub.on{background:var(--accent-soft);color:var(--accent-text);border-color:var(--accent-text)}
.filters{display:grid;gap:8px;margin-block:4px 14px}

/* summary strip */
.summary{display:flex;gap:18px;flex-wrap:wrap;padding:12px 2px 14px;border-bottom:1px dashed var(--line);margin-bottom:12px}
.summary div{display:flex;flex-direction:column}
.summary b{font:500 22px/1.1 var(--f-mono);font-variant-numeric:tabular-nums}
.summary span{font-size:12px;color:var(--muted)}
.section-title{font:700 16px/1.3 var(--f-display);margin:18px 0 10px;display:flex;align-items:baseline;gap:8px}
.section-title small{font:400 12px var(--f-body);color:var(--muted)}

/* item grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
@media (min-width:640px){.grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}}
.card{display:flex;flex-direction:column;gap:6px;text-align:left;background:none;border:0;padding:0;min-width:0}
.thumb{position:relative;aspect-ratio:1;max-width:100%;width:100%;border-radius:12px;background:var(--tile);overflow:hidden;display:grid;place-items:center}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb svg{width:78%;height:78%}
.thumb .badge{position:absolute;left:6px;top:6px}
.card .nm{font-size:13px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
.seasons{display:flex;gap:3px}
.seasons i{font-style:normal;font-size:10.5px;width:17px;height:17px;display:grid;place-items:center;border-radius:5px;color:var(--muted);background:var(--tile)}
.seasons i.on{background:var(--teal-soft);color:var(--teal);font-weight:600}
.badge{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:6px;font-size:11px;font-weight:600;background:var(--surface);color:var(--muted)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.teal{background:var(--teal-soft);color:var(--teal)}
.badge.acc{background:var(--accent-soft);color:var(--accent-text)}
.card.dim{opacity:.55}

/* beauty list */
.rows{display:grid;gap:8px}
.row{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;text-align:left;width:100%}
.row .thumb{width:56px;height:56px;flex:none;border-radius:10px}
.row .meta{flex:1;min-width:0}
.row .meta b{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .side{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.alert{background:var(--warn-soft);border-radius:var(--r);padding:12px 14px;margin-bottom:14px}
.alert h3{margin:0 0 8px;font-size:14px;color:var(--warn)}
.alert .chips .chip{border-color:transparent}

.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty h3{font:700 17px var(--f-display);color:var(--ink);margin:0 0 6px}
.empty p{margin:0 auto 16px;max-width:30em}

/* outfits */
.ogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ocard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0 0 10px;text-align:left;overflow:hidden;min-width:0}
.ocard .board{border-radius:0;border:0;border-bottom:1px solid var(--line)}
.ocard b{display:block;padding:8px 10px 2px;font-size:14px}
.ocard span{display:block;padding:0 10px;font-size:12px;color:var(--muted)}

/* outfit board */
.dress{display:grid;gap:14px}
@media (min-width:760px){.dress{grid-template-columns:minmax(300px,420px) 1fr;align-items:start}.board-col{position:sticky;top:calc(env(safe-area-inset-top,0px) + 120px)}}
.board-col{display:grid;gap:8px;min-width:0}
.board{position:relative;aspect-ratio:3/4;max-width:100%;width:100%;background-color:var(--board);background-image:radial-gradient(var(--board-dot) 1px,transparent 1.2px);background-size:16px 16px;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.board .pc{position:absolute;touch-action:none;user-select:none;-webkit-user-select:none}
.board .pc img{display:block;width:100%;height:auto;pointer-events:none;-webkit-user-drag:none}
.board .pc.photo img{border-radius:8px;box-shadow:0 1px 3px rgba(20,40,28,.18)}
.board .pc.cut img{filter:drop-shadow(0 2px 3px rgba(20,40,28,.18))}
.board .pc .ph{width:100%;aspect-ratio:1;background:var(--tile);border-radius:8px;display:grid;place-items:center}
.board .pc .ph svg{width:80%;height:80%}
.board:not(.live) .pc{touch-action:auto}
.board.live .pc{cursor:grab}
.board.live .pc.sel{outline:2px dashed var(--accent-text);outline-offset:3px}
.board .handle{position:absolute;right:-13px;bottom:-13px;width:28px;height:28px;border-radius:50%;background:var(--accent);border:2px solid var(--surface);box-shadow:var(--shadow);display:none;touch-action:none}
.board.live .pc.sel .handle{display:block}
.board-empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted);font-size:13.5px;pointer-events:none}
.ptools{display:flex;gap:6px;flex-wrap:wrap;min-height:34px;align-items:center}
.thumb.cutimg img{object-fit:contain;padding:8%}
.panel{display:grid;gap:12px;min-width:0}
.tray{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.tile{display:flex;flex-direction:column;gap:4px;background:none;border:0;padding:0;text-align:center;font-size:12px;min-width:0}
.tile .thumb{border:2px solid transparent}
.tile.on .thumb{border-color:var(--accent-text)}
.tile .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wearing{display:flex;flex-wrap:wrap;gap:6px}
.editing{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--teal-soft);color:var(--teal);border-radius:12px;padding:8px 12px;font-size:13.5px}
.hint{font-size:12.5px;color:var(--muted);margin:0}

/* FAB + tabs */
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 78px);z-index:25;height:50px;padding:0 18px;border-radius:16px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;box-shadow:var(--shadow);display:flex;align-items:center;gap:6px}
.fab svg{width:20px;height:20px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs .in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:11.5px;color:var(--muted)}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--accent-text);font-weight:600}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:40;background:rgba(20,16,24,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:calc(100% - env(safe-area-inset-top,0px) - 24px);overflow-y:auto;border-radius:22px 22px 0 0;padding:6px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 18px) max(16px,env(safe-area-inset-left,0px));animation:up .22s ease-out;overscroll-behavior:contain}
@media (min-width:700px){.sheet-wrap{align-items:center}.sheet{border-radius:22px;max-height:90%;padding-bottom:20px}}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 6px}
.sheet-head{display:flex;align-items:center;gap:10px;position:sticky;top:-6px;background:var(--bg);padding-block:8px;z-index:2}
.sheet-head h2{flex:1;margin:0;font:700 19px var(--f-display)}
.field{display:grid;gap:7px;margin-block:14px}
.lbl{font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inputs .full{grid-column:1/-1}
.inp{display:grid;gap:5px;min-width:0}
.inp input,.inp select,.inp textarea,textarea.inp-area{width:100%;min-width:0;height:42px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 11px;outline:none}
.inp textarea,textarea.inp-area{height:auto;min-height:70px;padding:9px 11px;resize:vertical}
.inp input:focus,.inp select:focus,.inp textarea:focus{border-color:var(--accent-text)}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);padding:0;position:relative}
.sw.on{box-shadow:0 0 0 2px var(--accent-text)}
.sw-wrap{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--muted);width:42px;background:none;border:0;padding:0}
.photo-pick{display:flex;align-items:center;gap:14px;margin-top:6px}
.photo-box{width:108px;height:108px;flex:none;border-radius:14px;background:var(--tile);display:grid;place-items:center;overflow:hidden;cursor:pointer;position:relative;border:1px dashed var(--muted)}
.photo-box img{width:100%;height:100%;object-fit:cover}
.photo-box svg{width:70%;height:70%;opacity:.85}
.photo-box span{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:11.5px;color:var(--ink);font-weight:600}
.photo-side{display:grid;gap:6px;font-size:12.5px;color:var(--muted)}
.dup{border-radius:var(--r);padding:12px 14px;font-size:13.5px}
.dup.has{background:var(--warn-soft)}
.dup.none{background:var(--ok-soft);color:var(--ok)}
.dup p{margin:0 0 8px}
.dup p:last-child{margin:0}
.dup .mini{display:flex;gap:6px;overflow-x:auto}
.dup .mini .thumb{width:54px;height:54px;flex:none;border-radius:9px}
.dup .mini button{border:0;padding:0;background:none}
.sheet-actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.sheet-actions .btn{flex:1}

/* garment tag (detail) */
.tag{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:560px){.tag{grid-template-columns:200px 1fr}}
.tag .thumb{border-radius:16px}
.tag-card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 16px 14px}
.tag-card::before{content:"";position:absolute;top:12px;right:14px;width:12px;height:12px;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line)}
.tag-card h3{margin:0 0 2px;font:700 18px var(--f-display);padding-right:24px}
.tag-card .crumb{color:var(--muted);font-size:12.5px;margin:0 0 12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:13.5px;border-top:1px dashed var(--line);padding-top:10px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.stat-list{display:grid;gap:6px;font-size:13.5px}
.stat-list div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding-block:6px}
.cut-wrap{position:fixed;inset:0;z-index:50;background:rgba(16,30,22,.5);display:flex;align-items:flex-end;justify-content:center}
.cut{background:var(--bg);width:100%;max-width:640px;max-height:calc(100% - env(safe-area-inset-top,0px) - 12px);overflow-y:auto;border-radius:22px 22px 0 0;padding:6px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:700px){.cut-wrap{align-items:center}.cut{border-radius:22px}}
.cut-stage{display:grid;place-items:center;border-radius:14px;overflow:hidden;background:var(--tile);padding:8px}
.cut-stage canvas{max-width:100%;max-height:50vh;touch-action:none;display:block;cursor:crosshair}
.cut-stage canvas.bg-check{background-color:#fff;background-image:linear-gradient(45deg,#e3e3e3 25%,transparent 25%,transparent 75%,#e3e3e3 75%),linear-gradient(45deg,#e3e3e3 25%,transparent 25%,transparent 75%,#e3e3e3 75%);background-size:16px 16px;background-position:0 0,8px 8px}
.cut-stage canvas.bg-white{background:#fff}
.cut-stage canvas.bg-green{background:#C7E8A0}
.cut-stage canvas.bg-dark{background:#2a2f2c}
.cut-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.mini-range{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);flex:1 1 150px}
.mini-range input{flex:1;min-width:0;accent-color:var(--accent-text)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);height:34px;padding:0 12px;font-size:13.5px}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.photo-acts{display:flex;gap:6px;flex-wrap:wrap}

<script>
'use strict';
/* ============ constants ============ */
const SEASONS=[['spring','春'],['summer','夏'],['autumn','秋'],['winter','冬']];
const COLORS=[['black','黑色','#232326'],['white','白色','#F8F8F4'],['grey','灰色','#9C9CA3'],['cream','米白','#EFE4CF'],['khaki','卡其','#C9B48A'],['camel','驼色','#B98A5C'],['brown','棕色','#74503A'],['red','红色','#CF3539'],['wine','酒红','#7A1E36'],['pink','粉色','#F2A9C0'],['orange','橙色','#EC8838'],['yellow','黄色','#F1CF4A'],['green','绿色','#6FA96B'],['olive','墨绿','#34503F'],['skyblue','浅蓝','#A8CCEA'],['blue','蓝色','#3D6CC0'],['navy','藏青','#27345B'],['denim','牛仔蓝','#5A7AA5'],['purple','紫色','#9A7AC3'],['metal','金银','#C8B47E'],['multi','花色','multi']];
const COLOR=Object.fromEntries(COLORS.map(c=>[c[0],{name:c[1],hex:c[2]}]));
const KIND={
  clothes:{label:'衣服',unit:'件',status:['在穿','闲置','已处理'],gone:'已处理',cats:[
    {key:'top',label:'上衣',subs:['T恤','衬衫','背心吊带','卫衣','毛衣针织','打底衫','Polo衫','雪纺衫']},
    {key:'outer',label:'外套',subs:['西装','夹克','风衣','大衣','羽绒服','棉服','皮衣','牛仔外套','针织开衫','马甲','防晒衣']},
    {key:'pants',label:'裤子',subs:['牛仔裤','休闲裤','西裤','阔腿裤','运动裤','工装裤','打底裤','短裤']},
    {key:'skirt',label:'半身裙',subs:['短裙','中长裙','长裙','百褶裙','A字裙','包臀裙','牛仔裙']},
    {key:'dress',label:'连衣裙',subs:['短款连衣裙','中长连衣裙','长款连衣裙','吊带裙','衬衫裙','针织裙','连体裤']},
    {key:'shoes',label:'鞋子',subs:['运动鞋','帆布鞋','板鞋','乐福鞋','玛丽珍','高跟鞋','平底鞋','短靴','长靴','凉鞋','拖鞋']},
    {key:'bag',label:'包包',subs:['托特包','斜挎包','腋下包','双肩包','手拿包','帆布包']},
    {key:'acc',label:'配饰',subs:['帽子','毛线帽','围巾','眼镜墨镜','腰带','项链','耳饰','手链戒指','发饰','手套']},
    {key:'inner',label:'内搭家居',subs:['内衣','袜子','家居服','睡衣','泳衣','运动服']}]},
  skincare:{label:'护肤品',unit:'件',status:['在用','囤货','用完了'],gone:'用完了',cats:[
    {key:'clean',label:'清洁卸妆',subs:['卸妆油','卸妆水','卸妆膏','洁面','清洁面膜']},
    {key:'toner',label:'水',subs:['化妆水','爽肤水','湿敷水','喷雾']},
    {key:'serum',label:'精华',subs:['精华液','安瓶','精华油']},
    {key:'eye',label:'眼部',subs:['眼霜','眼部精华']},
    {key:'moist',label:'乳霜',subs:['乳液','面霜','凝露','面油']},
    {key:'sun',label:'防晒隔离',subs:['防晒霜','防晒喷雾','隔离']},
    {key:'mask',label:'面膜',subs:['贴片面膜','涂抹面膜','睡眠面膜']},
    {key:'body',label:'身体头发',subs:['身体乳','沐浴露','护手霜','洗发水','护发素','发膜']},
    {key:'lipcare',label:'唇部',subs:['润唇膏','唇膜']},
    {key:'other',label:'其他',subs:['香水','美容仪','其他']}]},
  makeup:{label:'彩妆',unit:'件',status:['在用','囤货','用完了'],gone:'用完了',cats:[
    {key:'base',label:'底妆',subs:['妆前乳','粉底液','气垫','粉霜','遮瑕','散粉蜜粉','粉饼','定妆喷雾']},
    {key:'eyes',label:'眼妆',subs:['眼影','眼线','睫毛膏','眉笔','眉粉','染眉膏','卧蚕笔','假睫毛']},
    {key:'cheek',label:'腮红修容',subs:['腮红','高光','修容']},
    {key:'lips',label:'唇妆',subs:['口红','唇釉','唇泥','唇蜜','唇线笔']},
    {key:'tools',label:'工具',subs:['化妆刷','美妆蛋','粉扑','睫毛夹']},
    {key:'nail',label:'美甲',subs:['指甲油','甲片']}]}
};
const OCCASIONS=['通勤','上课','约会','逛街','休闲','运动','旅行','聚会','正式'];
const BOARD_CATS=[['top','上衣'],['outer','外套'],['bottom','下装'],['dress','连衣裙'],['shoes','鞋子'],['bag','包包'],['acc','配饰'],['inner','内搭家居'],['beauty','美妆']];
const LAYOUT={outer:{x:4,y:3,w:42},top:{x:52,y:3,w:42},dress:{x:52,y:3,w:44},bottom:{x:30,y:37,w:40},shoes:{x:4,y:71,w:34},bag:{x:60,y:67,w:34},acc:{x:4,y:42,w:24},inner:{x:4,y:42,w:24},beauty:{x:74,y:40,w:20}};

/* ============ utils ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const curSeason=()=>{const m=new Date().getMonth()+1;return m>=3&&m<=5?'spring':m<=8&&m>=6?'summer':m>=9&&m<=11?'autumn':'winter'};
const seasonName=k=>(SEASONS.find(s=>s[0]===k)||[])[1]||'';
function darken(hex,a){if(!hex||hex[0]!=='#')return '#6c6470';let n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;const f=x=>Math.max(0,Math.round(x*(1-a)));return '#'+((1<<24)+(f(r)<<16)+(f(g)<<8)+f(b)).toString(16).slice(1)}
function lum(hex){if(!hex||hex[0]!=='#')return .5;const n=parseInt(hex.slice(1),16);return((n>>16)*.299+(n>>8&255)*.587+(n&255)*.114)/255}
function catOf(i){return (KIND[i.kind].cats.find(c=>c.key===i.cat))||{label:'',subs:[]}}
function itemName(i){if(i.name)return i.name;const c=i.kind==='clothes'&&COLOR[i.color]?COLOR[i.color].name:'';return c+(i.sub||catOf(i).label)}
function isGone(i){return i.status===KIND[i.kind].gone}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2000)}
function dataURLtoBlob(d){const [h,b]=d.split(',');const mime=(h.match(/:(.*?);/)||[])[1]||'image/jpeg';const bin=atob(b);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:mime})}

/* ============ storage (IndexedDB with fallback) ============ */
const DB={db:null,
  open(){return new Promise((res,rej)=>{try{const r=indexedDB.open('wardrobe-journal',1);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');if(!d.objectStoreNames.contains('photos'))d.createObjectStore('photos')};r.onsuccess=()=>{this.db=r.result;res(true)};r.onerror=()=>rej(r.error)}catch(e){rej(e)}})},
  req(store,mode,fn){return new Promise((res,rej)=>{if(!this.db)return res(null);try{const tx=this.db.transaction(store,mode);const st=tx.objectStore(store);const r=fn(st);tx.oncomplete=()=>res(r&&r.result);tx.onerror=()=>rej(tx.error)}catch(e){rej(e)}})},
  get(s,k){return this.req(s,'readonly',st=>st.get(k))},
  set(s,k,v){return this.req(s,'readwrite',st=>st.put(v,k))},
  del(s,k){return this.req(s,'readwrite',st=>st.delete(k))},
  clear(s){return this.req(s,'readwrite',st=>st.clear())},
  all(s){return new Promise((res,rej)=>{if(!this.db)return res([]);try{const out=[];const tx=this.db.transaction(s,'readonly');const c=tx.objectStore(s).openCursor();c.onsuccess=()=>{const cur=c.result;if(cur){out.push([cur.key,cur.value]);cur.continue()}};tx.oncomplete=()=>res(out);tx.onerror=()=>rej(tx.error)}catch(e){rej(e)}})}
};
let S=null; const photoData=new Map(), photoURL=new Map(); let storageOK=true;
function setPhoto(id,data){photoData.set(id,data);if(photoURL.has(id))URL.revokeObjectURL(photoURL.get(id));try{photoURL.set(id,URL.createObjectURL(dataURLtoBlob(data)))}catch(e){photoURL.set(id,data)}}
function rmPhoto(id){photoData.delete(id);if(photoURL.has(id))URL.revokeObjectURL(photoURL.get(id));photoURL.delete(id);DB.del('photos',id).catch(()=>{})}
let saveT;function save(){if(Cloud.on){Cloud.dirty=true;clearTimeout(saveT);saveT=setTimeout(flush,400);setStatus();return}Cloud.localHad=true;clearTimeout(saveT);saveT=setTimeout(()=>{DB.set('kv','state',JSON.parse(JSON.stringify(S))).catch(()=>{storageOK=false;renderBanner()})},250)}

/* ============ cloud sync (Claude artifact db + assets) ============ */
const Cloud={on:false,col:null,assets:null,synced:new Map(),dirty:false,writing:false,again:false,lastSnap:null,status:'local',ephemeral:false,localHad:false};
function stable(v){if(Array.isArray(v))return '['+v.map(stable).join(',')+']';if(v&&typeof v==='object')return '{'+Object.keys(v).filter(k=>v[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+stable(v[k])).join(',')+'}';return JSON.stringify(v===undefined?null:v)}
function docsFromState(){const m=new Map();m.set('profile',{board:S.board||{pieces:[]},sample:!!S.sample,v:2});S.items.forEach(i=>m.set('item-'+i.id,i));S.outfits.forEach(o=>m.set('outfit-'+o.id,o));return m}
async function retry(fn){for(let n=0;;n++){try{return await fn()}catch(e){if(e&&(e.code==='resource_exhausted'||e.code==='unavailable')&&n<5){await new Promise(r=>setTimeout(r,900*(n+1)+Math.random()*500));continue}throw e}}}
async function flush(){
  if(!Cloud.on)return;
  if(Cloud.writing){Cloud.again=true;return}
  Cloud.writing=true;Cloud.dirty=false;setStatus();
  try{
    if(Cloud.ephemeral){Cloud.ephemeral=false;Cloud.synced=new Map()}
    const want=docsFromState();
    for(const [k,v] of want){const js=stable(v);if(Cloud.synced.get(k)!==js){await retry(()=>Cloud.col.doc(k).set(JSON.parse(js)));Cloud.synced.set(k,js)}}
    for(const k of [...Cloud.synced.keys()])if(!want.has(k)){await retry(()=>Cloud.col.doc(k).delete());Cloud.synced.delete(k)}
    Cloud.error=null;
  }catch(e){Cloud.error=e;toast(e&&e.code==='quota_exceeded'?'云端空间满了，删掉一些记录后再试':'同步没成功，稍后会再试');setTimeout(()=>{if(Cloud.on&&!Cloud.writing){Cloud.dirty=true;flush()}},15000)}
  Cloud.writing=false;
  if(Cloud.again||Cloud.dirty){Cloud.again=false;return flush()}
  if(Cloud.lastSnap){const sn=Cloud.lastSnap;Cloud.lastSnap=null;applySnap(sn)}
  setStatus();
}
function applySnap(snap){
  if(Cloud.ephemeral){if(snap.empty)return;Cloud.ephemeral=false}
  if(Cloud.writing||Cloud.dirty){Cloud.lastSnap=snap;return}
  const st=freshState();const syn=new Map();
  snap.docs.forEach(d=>{const v=d.data();if(!v)return;const js=stable(v);syn.set(d.id,js);const o=JSON.parse(js);
    if(d.id==='profile'){st.board=o.board||null;st.wear=o.wear;st.sample=!!o.sample}
    else if(d.id.startsWith('item-'))st.items.push(o);else if(d.id.startsWith('outfit-'))st.outfits.push(o)});
  const sig=m=>[...m].map(([k,v])=>k+'|'+v).sort().join('\n');
  const same=!!S&&sig(new Map([...docsFromState()].map(([k,v])=>[k,stable(v)])))===sig(syn);
  Cloud.synced=syn;
  if(same)return;
  S=normalizeState(st);render();if(sheet&&['item','outfit','settings'].includes(sheet.type))renderSheet();
}
async function migrate(){
  if(!Cloud.localHad){Cloud.ephemeral=true;return} // nothing of yours yet: show examples, save on first change
  Cloud.dirty=true;setStatus();
  if(Cloud.assets){for(const [k,d] of [...photoData]){const isCut=k.endsWith('_cut');const i=getItem(isCut?k.slice(0,-4):k);if(!i)continue;try{const r=await Cloud.assets.upload(dataURLtoBlob(d),{type:mimeOf(d)});i[isCut?'cut':'photo']=r.id}catch(e){}}}
  Cloud.synced=new Map();Cloud.dirty=false;await flush();
  if(!Cloud.error){DB.del('kv','state').catch(()=>{});if(Cloud.assets)DB.clear('photos').catch(()=>{})}
}
async function connectCloud(){
  const c=window.claude;if(!c||typeof c.use!=='function')return;
  Cloud.status='connecting';setStatus();
  let db,user;try{[db,user]=await Promise.all([c.use('db'),c.use('user')])}catch(e){}
  if(!db||!user){Cloud.status='local';setStatus();return}
  const id=await user.id();if(!id){Cloud.status='local';setStatus();return}
  c.use('assets').then(a=>{Cloud.assets=a}).catch(()=>{});
  const col=db.collection('data/users/'+id);
  const timer=setTimeout(()=>{if(!Cloud.on){Cloud.status='unreachable';setStatus()}},10000);
  col.onSnapshot(async snap=>{
    if(!Cloud.on){
      if(snap.empty&&snap.metadata.fromCache)return;
      clearTimeout(timer);Cloud.assets=Cloud.assets||await c.use('assets').catch(()=>null);
      Cloud.on=true;Cloud.col=col;Cloud.status='on';clearTimeout(saveT);
      if(snap.empty)await migrate();else applySnap(snap);
      render();setStatus();return;
    }
    applySnap(snap);
  },err=>{clearTimeout(timer);Cloud.status=Cloud.on?'error':'unreachable';setStatus()});
}
function setStatus(){
  const el=document.getElementById('sync');if(!el)return;
  let t='',cls='';
  if(Cloud.on){if(Cloud.writing||Cloud.dirty){t='同步中';cls='busy'}else if(Cloud.error){t='同步出错';cls='bad'}else if(Cloud.ephemeral){t='云同步已开';cls='ok'}else{t='已云同步';cls='ok'}}
  else if(Cloud.status==='connecting'){t='连接中';cls='busy'}
  else if(Cloud.status==='unreachable'||Cloud.status==='error'){t='云端连不上';cls='bad'}
  else{t='仅本机';cls=''}
  el.hidden=false;el.textContent=t;el.className='sync '+cls;el.setAttribute('aria-label','同步状态：'+t);
}
function mimeOf(d){return (String(d).match(/^data:([^;,]+)/)||[])[1]||'image/jpeg'}
function srcOf(i,which){if(!i)return null;if(which==='cut')return i.cut?'/_blob/'+i.cut:photoURL.get(i.id+'_cut')||null;return i.photo?'/_blob/'+i.photo:photoURL.get(i.id)||null}
function photoSrc(i){return srcOf(i,'cut')||srcOf(i,'orig')}
function hasCut(i){return !!srcOf(i,'cut')}
async function storeImage(item,which,dataURL){

  else if(['贴片面膜'].includes(sub))g=`<rect x="13" y="10" width="34" height="42" rx="4" fill="${tint}" stroke="${s}" stroke-width="1.2"/><path d="M13 18 H47" stroke="${s}" stroke-width="1" stroke-dasharray="2 2"/><circle cx="30" cy="34" r="7" fill="none" stroke="${s}" stroke-width="1.2"/>`;

function thumbSVG(i){

  const c=paint(i.color,[],null);const defs=[];const p=paint(i.color,defs);
  return `<svg viewBox="0 0 60 60" aria-hidden="true"><defs>${defs.join('')}</defs><circle cx="30" cy="30" r="17" fill="${p.f}" stroke="${c.s}" stroke-width="1.5"/><text x="30" y="35" text-anchor="middle" font-size="13" fill="${lum(c.f)>.6?'#333':'#fff'}">${esc((i.sub||'').slice(0,1))}</text></svg>`;
}

const ui={tab:'clothes',season:'all',cat:'all',sub:'all',showGone:false,bcat:{skincare:'all',makeup:'all'},bstatus:{skincare:'all',makeup:'all'},q:'',bslot:'top',dseason:'all',sel:-1,editingOutfit:null,check:{kind:'clothes',cat:'top',sub:'',color:''}};

function chip(label,on,action,val,n,cls=''){return `<button class="chip ${cls} ${on?'on':''}" data-action="${action}" data-val="${esc(val)}">${esc(label)}${n!==undefined?` <span class="n">${n}</span>`:''}</button>`}

function emptyBox(title,text,btn){return `<div class="empty"><h3>${title}</h3><p>${text}</p>${btn||''}</div>`}

function viewClothes(){
  const all=S.items.filter(i=>i.kind==='clothes');

  const bySeason=live.filter(i=>ui.season==='all'||(i.seasons||[]).includes(ui.season));

function viewBeauty(kind){
  const K=KIND[kind];const all=S.items.filter(i=>i.kind===kind);
  const st=ui.bstatus[kind],bc=ui.bcat[kind];
  const byStatus=all.filter(i=>st==='all'?!isGone(i):i.status===st);
  const list=byStatus.filter(i=>bc==='all'||i.cat===bc);
  const exp=all.filter(i=>!isGone(i)&&daysLeft(i)!==null&&daysLeft(i)<=60).sort((a,b)=>daysLeft(a)-daysLeft(b));
  let h=`<div class="summary"><div><b>${all.filter(i=>i.status==='在用').length}</b><span>在用</span></div><div><b>${all.filter(i=>i.status==='囤货').length}</b><span>囤货</span></div><div><b>${exp.length}</b><span>快过期</span></div><div><b>${all.filter(isGone).length}</b><span>已用完</span></div></div>`;
  if(exp.length)h+=`<div class="alert"><h3>先用这些：快过期或已过期</h3><div class="chips">${exp.map(i=>`<button class="chip" data-action="open-item" data-id="${i.id}">${esc(itemName(i))} <span class="n">${daysLeft(i)<0?'已过期':daysLeft(i)+'天'}</span></button>`).join('')}</div></div>`;
  h+=`<div class="filters"><div class="chips scroll">${chip('全部',st==='all','bstatus','all')}${K.status.map(s=>chip(s,st===s,'bstatus',s,all.filter(i=>i.status===s).length)).join('')}</div>`;
  h+=`<div class="chips scroll">${chip('全部分类',bc==='all','bcat','all')}${K.cats.map(c=>{const n=byStatus.filter(i=>i.cat===c.key).length;return chip(c.label,bc===c.key,'bcat',c.key,n)}).join('')}</div></div>`;

function beautyRow(i){

function boardHTML(pieces,live){

function trayItems(){return S.items.filter(i=>!isGone(i)&&boardSlot(i)===ui.bslot&&(ui.dseason==='all'||i.kind!=='clothes'||(i.seasons||[]).includes(ui.dseason)))}

function matchItem(i,q){const c=i.kind==='clothes'&&COLOR[i.color]?COLOR[i.color].name:'';return [itemName(i),i.brand,i.sub,catOf(i).label,c,i.shade,i.note,i.material,KIND[i.kind].label].join(' ').toLowerCase().includes(q)}
function viewSearch(){
  const q=ui.q.trim().toLowerCase();

/* ============ render ============ */
function render(){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.tab===ui.tab));
  const v=$('#view');
  v.innerHTML=ui.q.trim()?viewSearch():({clothes:viewClothes,skincare:()=>viewBeauty('skincare'),makeup:()=>viewBeauty('makeup'),outfits:viewOutfits,board:viewBoard}[ui.tab])();
  $('#fabLabel').textContent={clothes:'添加衣服',skincare:'添加护肤品',makeup:'添加彩妆',outfits:'新搭配',board:'添加衣服'}[ui.tab];
  $('#fab').hidden=ui.tab==='board';
  const n=S.items.filter(i=>!isGone(i)).length;
  $('#topStat').textContent=`${S.items.filter(i=>i.kind==='clothes'&&!isGone(i)).length} 件衣物 · ${S.items.filter(i=>i.kind==='skincare'&&!isGone(i)).length} 件护肤 · ${S.items.filter(i=>i.kind==='makeup'&&!isGone(i)).length} 件彩妆`;
  if(!n)$('#topStat').textContent='记下你有的，就不会再买重复';
  renderBanner();
}
function renderBanner(){

  if(S.sample)h+=`<div class="banner"><p>现在看到的是<b>示例数据</b>，用来演示各个功能。准备好记录你自己的东西时，一键清空就行。</p><div class="acts"><button class="btn sm primary" data-action="clear-sample">清空示例，开始记录</button><button class="btn sm" data-action="keep-sample">先看看</button></div></div>`;

}
function go(tab){ui.tab=tab;ui.q='';$('#q').value='';try{history.replaceState(null,'','#'+tab)}catch(e){location.hash=tab}render();window.scrollTo(0,0)}

function similar(d){
  if(!d.cat)return [];
  return S.items.filter(i=>i.id!==d.id&&i.kind===d.kind&&!isGone(i)&&i.cat===d.cat&&(!d.sub||i.sub===d.sub)).map(i=>({i,same:d.kind==='clothes'?(d.color&&i.color===d.color):(d.shade&&i.shade&&i.shade.toLowerCase()===d.shade.toLowerCase())})).sort((a,b)=>b.same-a.same);
}
function dupHTML(d,mode){
  const sim=similar(d);const what=d.sub||catOf(d).label;
  if(!sim.length)return mode==='check'?`<div class="dup none"><p><b>你还没有「${esc(what)}」${d.color&&COLOR[d.color]?'（'+COLOR[d.color].name+'）':''}</b>，不会重复。</p></div>`:'';

  const a=el.dataset.action,val=el.dataset.val,id=el.dataset.id;
  if(el.tagName==='LABEL')return;
  switch(a){
    case 'tab':closeSheet();go(el.dataset.tab);break;
    case 'season':ui.season=val;render();break;
    case 'cat':ui.cat=val;ui.sub='all';render();break;
    case 'sub':ui.sub=val;render();break;
    case 'toggle-gone':ui.showGone=!ui.showGone;render();break;
    case 'bstatus':ui.bstatus[ui.tab]=val;render();break;
    case 'bcat':ui.bcat[ui.tab]=val;render();break;
    case 'fab':{
      if(ui.tab==='outfits'){ui.editingOutfit=null;S.board={pieces:[]};ui.sel=-1;save();go('board');break}
      const kind=ui.tab==='skincare'||ui.tab==='makeup'?ui.tab:'clothes';const d=newDraft(kind);
      if(kind==='clothes'&&ui.cat!=='all'){d.cat=ui.cat;d.sub=ui.sub!=='all'?ui.sub:KIND.clothes.cats.find(c=>c.key===ui.cat).subs[0]}
      if(kind==='clothes'&&ui.season!=='all')d.seasons=[ui.season];
      if(kind!=='clothes'&&ui.bcat[kind]!=='all'){d.cat=ui.bcat[kind];d.sub=KIND[kind].cats.find(c=>c.key===d.cat).subs[0]}
      openSheet({type:'form',draft:d});break}
    case 'close-sheet':closeSheet();break;
    case 'f-set':{syncDraft();const d=sheet.draft;d[el.dataset.field]=(el.dataset.field==='color'&&d.color===val)?'':val;if(el.dataset.field==='cat'){const c=KIND[d.kind].cats.find(x=>x.key===val);d.sub=c.subs[0]}sheet.armed=false;renderSheet();break}
    case 'f-season':{syncDraft();const d=sheet.draft;if(val==='all')d.seasons=SEASONS.map(s=>s[0]);else d.seasons=d.seasons.includes(val)?d.seasons.filter(s=>s!==val):[...d.seasons,val];renderSheet();break}
    case 'f-rmphoto':syncDraft();sheet.draft.photoNew=null;sheet.draft.photoRemoved=true;renderSheet();break;
    case 'f-save':saveDraft();break;
    case 'f-del':if(!sheet.armed){sheet.armed=true;syncDraft();renderSheet();break}{const nm=itemName(getItem(sheet.draft.id)||sheet.draft);deleteItem(sheet.draft.id);closeSheet();render();toast('已删除「'+nm+'」')}break;
    case 'open-item':openSheet({type:'item',id});break;
    case 'edit-item':{const i=getItem(sheet.id);openSheet({type:'form',draft:{...newDraft(i.kind),...JSON.parse(JSON.stringify(i)),photoNew:null,photoRemoved:false}});break}
    case 'worn-item':{const i=getItem(sheet.id);i.wearCount=(i.wearCount||0)+1;i.lastWorn=todayStr();save();renderSheet();render();toast('记下了，第 '+i.wearCount+' 次穿');break}
    case 'used-up':{const i=getItem(sheet.id);i.status='用完了';save();renderSheet();render();toast('已标记为用完了');break}
    case 'tryon':{const i=getItem(sheet.id);if(!S.board.pieces.some(p=>p.id===i.id))togglePiece(i.id);ui.bslot=boardSlot(i);save();closeSheet();go('board');break}
    case 'item-cut':{const i=getItem(sheet.id);openCut(srcOf(i,'orig'),async url=>{toast('正在保存抠好的图…');await storeImage(i,'cut',url);save();renderSheet();render();toast('抠好了')});break}
    case 'item-uncut':{const i=getItem(sheet.id);dropImage(i,'cut');save();renderSheet();render();toast('已改回原图');break}
    case 'f-cut':{syncDraft();const d=sheet.draft;const it=d.id&&getItem(d.id);const src=d.photoNew||(it&&srcOf(it,'orig'));if(src)openCut(src,url=>{d.cutNew=url;d.cutRemoved=false;renderSheet()});break}
    case 'f-uncut':syncDraft();sheet.draft.cutNew=null;sheet.draft.cutRemoved=true;renderSheet();break;
    case 'bslot':ui.bslot=val;render();break;
    case 'toggle-piece':togglePiece(id);save();render();break;
    case 'clear-board':S.board={pieces:[]};ui.sel=-1;save();render();break;
    case 'pc-size':{const p=S.board.pieces[ui.sel];if(p){p.w=Math.max(8,Math.min(100,Math.round(p.w*(val==='1'?1.15:0.87))));save();render()}break}
    case 'pc-front':{const p=S.board.pieces[ui.sel];if(p){p.z=S.board.pieces.reduce((m,q)=>Math.max(m,q.z||0),0)+1;save();render()}break}
    case 'pc-back':{const p=S.board.pieces[ui.sel];if(p){S.board.pieces.forEach(q=>q.z=(q.z||1)+1);p.z=1;save();render()}break}
    case 'pc-remove':S.board.pieces.splice(ui.sel,1);ui.sel=-1;save();render();break;
    case 'cut-cancel':closeCut();break;
    case 'cut-done':cutFinish();break;
    case 'cut-auto':cutAuto();break;
    case 'cut-white':cutWhite();break;
    case 'cut-mode':Cut.mode=val;cutUI();break;
    case 'cut-bg':Cut.bg=val;cutUI();break;
    case 'cut-undo':cutUndo();break;
    case 'cut-reset':cutPush();Cut.mask.fill(255);cutRedraw();break;
    case 'open-outfit':openSheet({type:'outfit',id});break;
    case 'wear-outfit':{const o=S.outfits.find(x=>x.id===sheet.id);o.wornCount=(o.wornCount||0)+1;o.lastWorn=todayStr();(o.pieces||[]).map(p=>p.id).forEach(iid=>{const i=getItem(iid);if(i&&i.kind==='clothes'){i.wearCount=(i.wearCount||0)+1;i.lastWorn=todayStr()}});save();renderSheet();render();toast('今天穿「'+o.name+'」，已记录');break}
    case 'edit-outfit':{const o=S.outfits.find(x=>x.id===sheet.id);S.board={pieces:(o.pieces||[]).map(p=>({...p}))};ui.sel=-1;ui.editingOutfit=o.id;save();closeSheet();go('board');break}
    case 'del-outfit':if(!sheet.armed){sheet.armed=true;renderSheet();break}S.outfits=S.outfits.filter(o=>o.id!==sheet.id);if(ui.editingOutfit===sheet.id)ui.editingOutfit=null;save();closeSheet();render();toast('已删除搭配');break;
    case 'dseason':ui.dseason=val;render();break;
    case 'random':randomOutfit();break;
    case 'cancel-edit':ui.editingOutfit=null;render();break;
    case 'save-outfit':case 'save-outfit-new':{
      const ed=a==='save-outfit'&&ui.editingOutfit&&S.outfits.find(o=>o.id===ui.editingOutfit);
      openSheet({type:'saveOutfit',draft:ed?{id:ed.id,name:ed.name,occasions:[...(ed.occasions||[])],note:ed.note||''}:{name:'搭配 '+(S.outfits.length+1),occasions:[],note:''}});break}
    case 'o-occ':{syncOutfitDraft();const d=sheet.draft;d.occasions=d.occasions.includes(val)?d.occasions.filter(x=>x!==val):[...d.occasions,val];renderSheet();break}
    case 'o-save':{syncOutfitDraft();const d=sheet.draft;const name=d.name||('搭配 '+(S.outfits.length+1));
      if(d.id){const o=S.outfits.find(x=>x.id===d.id);Object.assign(o,{name,occasions:d.occasions,note:d.note,pieces:S.board.pieces.map(p=>({...p}))})}
      else S.outfits.push({id:uid(),name,pieces:S.board.pieces.map(p=>({...p})),occasions:d.occasions,note:d.note,wornCount:0,lastWorn:'',created:Date.now()});
      ui.editingOutfit=null;save();closeSheet();render();toast('已保存「'+name+'」，在「搭配」里能找到');break}
    case 'check':openSheet({type:'check'});break;
    case 'c-kind':ui.check={kind:val,cat:KIND[val].cats[0].key,sub:'',color:''};renderSheet();break;
    case 'c-cat':ui.check.cat=val;ui.check.sub='';renderSheet();break;
    case 'c-sub':ui.check.sub=val;renderSheet();break;
    case 'c-color':ui.check.color=ui.check.color===val?'':val;renderSheet();break;
    case 'settings':openSheet({type:'settings'});break;
    case 'export-file':{toast('正在打包备份…');const txt=await exportData();const fn='我的衣柜备份-'+todayStr()+'.json';
      const dl=window.claude&&window.claude.use?await window.claude.use('downloads').catch(()=>null):null;
      if(dl){try{await dl.save({filename:fn,data:txt});toast('备份已保存')}catch(err){toast(err&&err.code==='declined'?'没有保存':'这里存不了文件，请用「复制备份文本」')}break}
      try{const b=new Blob([txt],{type:'application/json'});const u=URL.createObjectURL(b);const l=document.createElement('a');l.href=u;l.download=fn;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('备份文件已生成；如果没开始下载，请用「复制备份文本」')}catch(err){toast('这里不能下载文件，请用「复制备份文本」')}break}
    case 'export-copy':{const t=await exportData();try{await navigator.clipboard.writeText(t);toast('备份文本已复制，粘贴到备忘录里存好')}catch(err){const ta=document.getElementById('import-text');ta.value=t;ta.select();toast('已放进下面的文本框并选中，请手动复制')}break}
    case 'import-text':{const t=document.getElementById('import-text').value.trim();try{sheet.pendingImport=parseImport(t);renderSheet()}catch(err){toast('这段文本不是我的衣柜的备份')}break}
    case 'import-confirm':await applyImport(sheet.pendingImport);sheet.pendingImport=null;closeSheet();render();toast('导入完成');break;
    case 'import-cancel':sheet.pendingImport=null;renderSheet();break;
    case 'wipe':if(!sheet.armed){sheet.armed=true;renderSheet();break}S.items.forEach(i=>{dropImage(i,'orig');dropImage(i,'cut')});for(const pid of [...photoURL.keys()])rmPhoto(pid);await DB.clear('photos').catch(()=>{});{const av=S.avatar;S=freshState();S.avatar=av}save();closeSheet();render();toast('已全部清空');break;
    case 'clear-sample':{const ids=S.items.filter(i=>i.sample).map(i=>i.id);ids.forEach(rmPhoto);S.items=S.items.filter(i=>!i.sample);S.outfits=S.outfits.filter(o=>!o.sample);S.board={pieces:[]};ui.sel=-1;S.sample=false;save();render();toast('示例已清空，点「添加衣服」开始吧');break}
    case 'keep-sample':S.sample=false;save();renderBanner();toast('示例保留着，随时可以在单品里删除');break;
  }
}
document.addEventListener('click',onClick);

  if(e.target.id==='f-photo'&&e.target.files[0]){syncDraft();try{sheet.draft.photoNew=await compress(e.target.files[0]);sheet.draft.photoRemoved=false;renderSheet()}catch(err){toast('这张图片读不出来，换一张试试')}}

function compress(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const max=900;const sc=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82))};img.onerror=rej;img.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}
$('#sheetWrap').addEventListener('click',e=>{if(e.target.id==='sheetWrap')closeSheet()});

/* ============ board: drag to move, corner to resize ============ */
let drag=null;
document.addEventListener('pointerdown',e=>{
  const pc=e.target.closest('#board .pc');
  if(!pc){if(e.target.closest('#board')&&ui.sel!==-1){ui.sel=-1;document.querySelectorAll('#board .pc.sel').forEach(x=>x.classList.remove('sel'));$('#ptools').innerHTML=ptoolsHTML()}return}
  const idx=+pc.dataset.i;const p=S.board.pieces[idx];if(!p)return;
  e.preventDefault();
  if(ui.sel!==idx){ui.sel=idx;document.querySelectorAll('#board .pc.sel').forEach(x=>x.classList.remove('sel'));pc.classList.add('sel');$('#ptools').innerHTML=ptoolsHTML()}
  const r=pc.parentElement.getBoundingClientRect();
  drag={pc,p,r,sx:e.clientX,sy:e.clientY,ox:p.x,oy:p.y,ow:p.w,mode:e.target.classList.contains('handle')?'size':'move',moved:false};
  try{pc.setPointerCapture(e.pointerId)}catch(err){}
});
document.addEventListener('pointermove',e=>{
  if(!drag)return;const {p,r,pc}=drag;
  const dx=(e.clientX-drag.sx)/r.width*100,dy=(e.clientY-drag.sy)/r.height*100;
  if(Math.abs(dx)+Math.abs(dy)>.4)drag.moved=true;
  if(drag.mode==='move'){p.x=Math.round(Math.max(-30,Math.min(95,drag.ox+dx))*10)/10;p.y=Math.round(Math.max(-30,Math.min(95,drag.oy+dy))*10)/10;pc.style.left=p.x+'%';pc.style.top=p.y+'%'}
  else{p.w=Math.round(Math.max(8,Math.min(110,drag.ow+dx))*10)/10;pc.style.width=p.w+'%'}
});
function endDrag(){if(!drag)return;const m=drag.moved;drag=null;if(m)save()}
document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',endDrag);

/* ============ cutout editor ============ */
const Cut={mode:'erase',bg:'check',undo:[]};
function cutStatus(t){$('#cutStatus').textContent=t}
function cutUI(){
  document.querySelectorAll('#cutSeg button').forEach(b=>b.classList.toggle('on',b.dataset.val===Cut.mode));
  document.querySelectorAll('#cutBg button').forEach(b=>b.classList.toggle('on',b.dataset.val===Cut.bg));
  $('#cutCanvas').className='bg-'+Cut.bg;
}
function openCut(src,onDone){
  Object.assign(Cut,{onDone,mode:'erase',undo:[],ready:false,busy:false});
  $('#cutWrap').hidden=false;cutUI();cutStatus('正在载入图片…');
  const img=new Image();
  img.onload=()=>{
    const max=1000;const sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const w=Math.max(1,Math.round(img.naturalWidth*sc)),h=Math.max(1,Math.round(img.naturalHeight*sc));
    const cv=$('#cutCanvas');cv.width=w;cv.height=h;const ctx=cv.getContext('2d',{willReadFrequently:true});
    ctx.clearRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);
    try{Cut.orig=ctx.getImageData(0,0,w,h)}catch(e){cutStatus('这张图读不出来，换一张试试');return}
    Object.assign(Cut,{w,h,ctx,mask:new Uint8ClampedArray(w*h).fill(255),out:new ImageData(new Uint8ClampedArray(Cut.orig.data),w,h),ready:true});
    cutStatus('点「智能抠图」自动去掉背景；白底或纯色背景的商品图用「纯色背景抠图」更快更干净。没抠干净的地方，用「擦掉」「补回」在图上涂一涂。');
  };
  img.onerror=()=>cutStatus('图片打不开，换一张试试');
  img.src=src;
}
function closeCut(){$('#cutWrap').hidden=true;Cut.ready=false}
function cutRedraw(x0=0,y0=0,x1=Cut.w,y1=Cut.h){
  const d=Cut.out.data,o=Cut.orig.data,m=Cut.mask,w=Cut.w;
  for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){const i=y*w+x;d[i*4+3]=Math.min(o[i*4+3],m[i])}
  Cut.ctx.putImageData(Cut.out,0,0,x0,y0,x1-x0,y1-y0);
}
function cutPush(){if(!Cut.ready)return;Cut.undo.push(Cut.mask.slice());if(Cut.undo.length>12)Cut.undo.shift()}
function cutUndo(){const m=Cut.undo.pop();if(!m){toast('没有可以撤销的了');return}Cut.mask=m;cutRedraw()}
/* plain-background cutout: flood fill from the edges over pixels close to the background colour */
function cutWhite(){
  if(!Cut.ready||Cut.busy)return;cutPush();
  const {w,h}=Cut,d=Cut.orig.data,tol=+$('#cutTol').value;
  const hist=new Map();const add=i=>{const k=(d[i*4]>>4)<<8|(d[i*4+1]>>4)<<4|(d[i*4+2]>>4);hist.set(k,(hist.get(k)||0)+1)};
  for(let x=0;x<w;x++){add(x);add((h-1)*w+x)}for(let y=0;y<h;y++){add(y*w);add(y*w+w-1)}
  let best=0,bk=0;hist.forEach((v,k)=>{if(v>best){best=v;bk=k}});
  let br=0,bgc=0,bb=0,n=0;const chk=i=>{const k=(d[i*4]>>4)<<8|(d[i*4+1]>>4)<<4|(d[i*4+2]>>4);if(k===bk){br+=d[i*4];bgc+=d[i*4+1];bb+=d[i*4+2];n++}};
  for(let x=0;x<w;x++){chk(x);chk((h-1)*w+x)}for(let y=0;y<h;y++){chk(y*w);chk(y*w+w-1)}
  br/=n;bgc/=n;bb/=n;const t2=(tol*1.6)**2;
  const near=i=>{const a=d[i*4]-br,b=d[i*4+1]-bgc,c=d[i*4+2]-bb;return a*a+b*b+c*c<=t2||d[i*4+3]<20};
  const seen=new Uint8Array(w*h),q=new Int32Array(w*h);let qh=0,qt=0;
  const push=i=>{if(!seen[i]&&near(i)){seen[i]=1;q[qt++]=i}};
  for(let x=0;x<w;x++){push(x);push((h-1)*w+x)}for(let y=0;y<h;y++){push(y*w);push(y*w+w-1)}
  while(qh<qt){const i=q[qh++],x=i%w;if(x>0)push(i-1);if(x<w-1)push(i+1);if(i>=w)push(i-w);if(i<w*(h-1))push(i+w)}
  const m=new Uint8ClampedArray(w*h);for(let i=0;i<w*h;i++)m[i]=seen[i]?0:255;
  Cut.mask=soften(m,w,h);cutRedraw();
  const kept=Cut.mask.reduce((a,v)=>a+(v>128),0)/(w*h);
  cutStatus(kept>.97?'背景好像不是纯色，可以把灵敏度调高一点再试，或者用「智能抠图」。':kept<.03?'几乎全被去掉了，把灵敏度调低一点再试。':'好了。边缘不满意可以调灵敏度再点一次，或者用笔刷修一修。');
}
function soften(m,w,h){const o=new Uint8ClampedArray(w*h);for(let y=0;y<h;y++)for(let x=0;x<w;x++){let s=0,n=0;for(let dy=-1;dy<=1;dy++){const yy=y+dy;if(yy<0||yy>=h)continue;for(let dx=-1;dx<=1;dx++){const xx=x+dx;if(xx<0||xx>=w)continue;s+=m[yy*w+xx];n++}}o[y*w+x]=s/n}return o}
/* smart cutout: U²-Net (u2netp) running in the browser with onnxruntime-web; nothing is uploaded */
let ortSession=null;
async function modelBytes(){
  try{const r=await fetch('vendor/u2netp.onnx');const ct=r.headers.get('content-type')||'';if(r.ok&&!/html|text/.test(ct))return new Uint8Array(await r.arrayBuffer())}catch(e){}
  // where .onnx files can't be served, the same model ships as base64 text
  const r=await fetch('vendor/u2netp.onnx.b64.txt');if(!r.ok)throw new Error('model missing');
  const bin=atob((await r.text()).trim());const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;
}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function getSession(){
  if(ortSession)return ortSession;
  if(!window.ort)await loadScript('https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/ort.wasm.min.js');
  ort.env.wasm.numThreads=1;ort.env.wasm.proxy=false;ort.env.wasm.wasmPaths=new URL('vendor/',location.href).href;
  ortSession=await ort.InferenceSession.create(await modelBytes(),{executionProviders:['wasm']});
  return ortSession;
}
async function cutAuto(){
  if(!Cut.ready||Cut.busy)return;Cut.busy=true;
  cutStatus(ortSession?'正在抠图…':'第一次用要先下载抠图工具（约 15MB），请稍等…');
  try{
    const sess=await getSession();cutStatus('正在抠图…');
    await new Promise(r=>setTimeout(r,30));
    const N=320,c=document.createElement('canvas');c.width=N;c.height=N;const cx=c.getContext('2d',{willReadFrequently:true});
    cx.fillStyle='#fff';cx.fillRect(0,0,N,N);cx.drawImage($('#cutCanvas'),0,0,N,N);
    const src=document.createElement('canvas');src.width=Cut.w;src.height=Cut.h;src.getContext('2d').putImageData(Cut.orig,0,0);
    cx.fillRect(0,0,N,N);cx.drawImage(src,0,0,N,N);
    const px=cx.getImageData(0,0,N,N).data;let mx=1;for(let i=0;i<N*N;i++){mx=Math.max(mx,px[i*4],px[i*4+1],px[i*4+2])}
    const mean=[.485,.456,.406],std=[.229,.224,.225],f=new Float32Array(3*N*N);
    for(let i=0;i<N*N;i++)for(let k=0;k<3;k++)f[k*N*N+i]=(px[i*4+k]/mx-mean[k])/std[k];
    const out=await sess.run({[sess.inputNames[0]]:new ort.Tensor('float32',f,[1,3,N,N])});
    const pr=out[sess.outputNames[0]].data;let lo=Infinity,hi=-Infinity;for(const v of pr){if(v<lo)lo=v;if(v>hi)hi=v}
    const g=cx.createImageData(N,N);for(let i=0;i<N*N;i++){const v=(pr[i]-lo)/((hi-lo)||1);const a=Math.max(0,Math.min(1,(v-.2)/.6));g.data[i*4]=g.data[i*4+1]=g.data[i*4+2]=255;g.data[i*4+3]=Math.round(a*255)}
    cx.clearRect(0,0,N,N);cx.putImageData(g,0,0);
    const big=document.createElement('canvas');big.width=Cut.w;big.height=Cut.h;const bx=big.getContext('2d',{willReadFrequently:true});bx.imageSmoothingQuality='high';bx.drawImage(c,0,0,Cut.w,Cut.h);
    const md=bx.getImageData(0,0,Cut.w,Cut.h).data;cutPush();for(let i=0;i<Cut.w*Cut.h;i++)Cut.mask[i]=md[i*4+3];
    cutRedraw();cutStatus('抠好了。有没抠干净或者被多抠掉的地方，用「擦掉」「补回」涂一涂。');
  }catch(e){
    console.warn(e);
    cutStatus('智能抠图在这里没法运行，已经改用「纯色背景抠图」。白底的商品图效果最好，也可以用笔刷手动修。');
    Cut.busy=false;cutWhite();
  }
  Cut.busy=false;
}
/* brush */
let brush=null;
function cutPoint(e){const r=$('#cutCanvas').getBoundingClientRect();return{x:(e.clientX-r.left)*Cut.w/r.width,y:(e.clientY-r.top)*Cut.h/r.height,s:Cut.w/r.width}}
function dab(x,y,rad){
  const {w,h,mask}=Cut,er=Cut.mode==='erase';const x0=Math.max(0,Math.floor(x-rad)),x1=Math.min(w,Math.ceil(x+rad+1)),y0=Math.max(0,Math.floor(y-rad)),y1=Math.min(h,Math.ceil(y+rad+1));
  for(let yy=y0;yy<y1;yy++)for(let xx=x0;xx<x1;xx++){const dd=Math.hypot(xx-x,yy-y);if(dd>rad)continue;const f=Math.min(1,(rad-dd)/(rad*.35));const i=yy*w+xx;mask[i]=er?Math.min(mask[i],255*(1-f)):Math.max(mask[i],255*f)}
  return [x0,y0,x1,y1];
}
const cvs=document.getElementById('cutCanvas');
cvs.addEventListener('pointerdown',e=>{if(!Cut.ready||Cut.busy)return;e.preventDefault();cutPush();const p=cutPoint(e);brush={...p,rad:(+$('#cutSize').value)*p.s};try{cvs.setPointerCapture(e.pointerId)}catch(err){}const b=dab(p.x,p.y,brush.rad);cutRedraw(...b)});
cvs.addEventListener('pointermove',e=>{if(!brush)return;const p=cutPoint(e);const dist=Math.hypot(p.x-brush.x,p.y-brush.y),step=Math.max(1,brush.rad/3),n=Math.ceil(dist/step);let bx0=1e9,by0=1e9,bx1=0,by1=0;
  for(let k=1;k<=n;k++){const t=k/n;const b=dab(brush.x+(p.x-brush.x)*t,brush.y+(p.y-brush.y)*t,brush.rad);bx0=Math.min(bx0,b[0]);by0=Math.min(by0,b[1]);bx1=Math.max(bx1,b[2]);by1=Math.max(by1,b[3])}
  if(n)cutRedraw(bx0,by0,bx1,by1);brush.x=p.x;brush.y=p.y});
const endBrush=()=>{brush=null};cvs.addEventListener('pointerup',endBrush);cvs.addEventListener('pointercancel',endBrush);
function cutFinish(){
  if(!Cut.ready)return;const {w,h,mask}=Cut;let x0=w,y0=h,x1=-1,y1=-1;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(mask[y*w+x]>12){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
  if(x1<0){cutStatus('整张图都被擦掉了，点「还原原图」重新来。');return}
  const pad=Math.round(Math.max(x1-x0,y1-y0)*.03);x0=Math.max(0,x0-pad);y0=Math.max(0,y0-pad);x1=Math.min(w-1,x1+pad);y1=Math.min(h-1,y1+pad);
  const bw=x1-x0+1,bh=y1-y0+1,sc=Math.min(1,900/Math.max(bw,bh));const c=document.createElement('canvas');c.width=Math.round(bw*sc);c.height=Math.round(bh*sc);
  c.getContext('2d').drawImage($('#cutCanvas'),x0,y0,bw,bh,0,0,c.width,c.height);
  let url=c.toDataURL('image/webp',.9);if(!url.startsWith('data:image/webp'))url=c.toDataURL('image/png');
  const cb=Cut.onDone;closeCut();cb&&cb(url);
}

/* ============ boot ============ */
(async function boot(){
  let st=null;
  try{await DB.open();st=await DB.get('kv','state');const ph=await DB.all('photos');ph.forEach(([k,v])=>setPhoto(k,v))}catch(e){storageOK=false}
  Cloud.localHad=!!(st&&Array.isArray(st.items));
  S=Cloud.localHad?normalizeState({...freshState(),...st}):sampleState();
  const t=location.hash.slice(1);if(['clothes','skincare','makeup','outfits','board'].includes(t))ui.tab=t;
  render();setStatus();connectCloud();
  try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&document.querySelector('link[rel=manifest]'))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
})();
</script>
